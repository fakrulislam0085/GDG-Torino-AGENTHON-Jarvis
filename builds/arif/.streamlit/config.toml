[theme]
base = "light"
primaryColor = "#8A5A12"
backgroundColor = "#F5F0E6"
secondaryBackgroundColor = "#EDE5D5"
textColor = "#1E1A14"
borderColor = "#D9CEB8"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "Newsreader:https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseRadius = "6px"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
