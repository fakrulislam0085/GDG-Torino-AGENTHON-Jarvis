[theme]
base = "dark"
primaryColor = "#5CE1E6"
backgroundColor = "#05070B"
secondaryBackgroundColor = "#0B121A"
textColor = "#E6F1F5"
linkColor = "#5CE1E6"
borderColor = "#1D3A44"
showWidgetBorder = true
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "Chakra Petch:https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseRadius = "2px"

[theme.sidebar]
backgroundColor = "#070C12"
secondaryBackgroundColor = "#0B121A"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
