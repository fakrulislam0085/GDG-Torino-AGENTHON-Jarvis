ze:13px!important}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);border:1px solid #364969;border-radius:10px;padding:12px 18px;background:#1b2e4b;color:#fff;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;box-shadow:0 8px 30px #17243c25}.toast.on{opacity:1}.spin{display:inline-block;border:2px solid #93a8e5;border-top-color:white;border-radius:50%;width:13px;height:13px;animation:s .8s linear infinite}.thinking{color:var(--muted);font-size:14px}@keyframes s{to{transform:rotate(360deg)}}

<body>
<header>
  <div class="header-identity"><span class="brand"><span class="brand-mark">f</span><span>Company Brain<small>FILARE WORKSPACE</small></span></span>
  <span class="pill demo-label" title="All companies, people and messages are fictional">Synthetic demo</span>
  <span class="pill" id="mode">…</span>
  <span class="pill" id="clock">…</span>
  </div><div class="header-actions">
  <button id="sweepBtn" title="The scheduled background job. Nobody asks the brain anything.">⏰ Run morning sweep</button>
  <select id="eventSel" title="Simulate a source message arriving"><option value="">✉ Simulate incoming message…</option></select>
  <button id="pasteBtn" title="Type or paste your own email and see if you can trick the Brain">✍ Paste an email…</button>
  <label class="row" style="gap:6px">Viewing as
    <select id="personSel"></select>
  </label>
  <button class="ghost" id="resetBtn" style="display:none" title="CEO only. Open the page with ?admin=1">Reset</button></div>
</header>
<div class="app">
  <nav id="nav"></nav>
  <main>
    <div class="head"><h2 id="title"></h2><span class="sub" id="subtitle"></span><button class="trace-toggle" id="traceToggle" aria-expanded="false" aria-controls="tracePanel">Agent trace</button></div>
    <div class="scroll" id="view"></div>
    <div class="composer" id="composer">
      <div class="suggest" id="suggest"></div>
      <form id="askForm"><input id="q" autocomplete="off" placeholder="Ask a question. Get an approved, sourced answer." aria-label="Ask the brain"><button class="primary">Ask</button></form><div class="composer-note">Approved knowledge only. Your access is checked before every answer.</div>
    </div>
  </main>
  <aside id="tracePanel">
    <div class="head"><div class="row" style="justify-content:space-between"><h3>Agent trace</h3><button id="closeTrace" aria-label="Close agent trace">×</button></div><div class="muted" style="font-size:12px">Every step, every refused action, and what it cost.</div></div>
    <div class="runs" id="runs"></div>
    <div class="steps" id="steps"><div class="empty">Run the sweep or ask a question.</div></div>
    <div class="usage" id="usage"></div>
  </aside>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SUGGEST = ["When does the Langhe fix roll out?", "What is our cash runway?", "What is the Q1 2027 cloud budget?", "What's the office Wi-Fi password?"];
const URLP = new URLSearchParams(location.search);
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
let S = null, person = location.hash.slice(1) || URLP.get("as") || "davide", view = URLP.get("view") || "dm", activeRun = null, busy = false, thinking = null;
let showAllMem = false, lastSig = "", lastDmCount = -1, sweeping = false;
const drafts = {}, reasons = {}, speech = {}, dismissed = new Set();
let callSig = "", orbRaf = 0, orbSpeaking = false, curAudio = null;

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({user: person, ...body})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function load(quiet) {
  const selected = person;
  let state;
  try { state = await api(`/api/state?user=${encodeURIComponent(selected)}`); }
  catch (e) { if (!quiet) toast("⚠ " + e.message); throw e; }
  if (person !== selected) return;
  const sig = JSON.stringify(state);
  if (quiet && sig === lastSig) return;
  lastSig = sig; S = state;
  const el = document.activeElement;
  const typing = el && /INPUT|TEXTAREA|SELECT/.test(el.tagName) && el.id !== "q" && el.closest("#view, dialog");
  if (typing && quiet) { renderChrome(); renderCall(); return; }  // never wipe what someone is typing
  render();
}

/* ---------------------------------------------------------------- actions (drafts, meetings, tasks) */
function actionBox(a) {
  if (!a) return "";
  const kind = {email: "Draft email", task: "Task change", meeting: "Meeting"}[a.kind] || a.kind;
  const sample = a.origin.includes("offline") ? ` <span class="tag sample" title="Offline mode: this text was written by hand for the demo, not by the model">pre-written sample</span>` : "";
  let body = "";
  if (a.kind === "email") body = `<div class="muted" style="margin:8px 0 4px">To <b>${esc(a.to_name)}</b> · ${esc(a.subject)}</div>` +
    (a.can_decide ? `<textarea data-draft="${a.id}">${esc(a.body)}</textarea>` : `<pre>${esc(a.body)}</pre>`);
  else if (a.kind === "meeting" && a.meeting) body = `<div class="meeting">📅 <b>${esc(a.meeting.topic)}</b><br>${esc(a.meeting.start.replace("T", " "))} · ${a.meeting.minutes} min · with ${a.meeting.with.map(personName).map(esc).join(", ")}<br><span class="muted">Created only after you approve. Without Zoom keys the link is a labelled demo link.</span></div>`;
  else if (a.kind === "task" && a.task_id) body = `<div class="muted" style="margin:8px 0">On approval ${chips([a.task_id])} is unblocked for ${esc(personName(a.owner))}.</div>`;
  let foot;
  if (a.status === "waiting" && a.can_decide) {
    const label = a.kind === "email" ? "Approve (mock send)" : a.kind === "meeting" ? "Approve and create meeting" : "Approve";
    foot = `<div class="row"><button class="ok" data-act="${a.id}" data-d="approve">${label}</button><input type="text" data-reason="${a.id}" placeholder="Reason (optional, saved in the log)"><button data-act="${a.id}" data-d="reject">Reject</button></div><div class="muted" style="font-size:12px;margin-top:6px">Nothing moves until you approve.</div>`;
  } else if (a.status === "waiting") foot = `<div class="row"><span class="tag waiting">⏳ waiting for ${esc(a.approver_name)}</span><span class="muted" style="font-size:12px">Only ${esc(a.approver_name)} can decide. Switch persona to try.</span></div>`;
  else if (a.status === "approved") foot = `<div class="muted">✅ Approved by ${esc(personName(a.decided_by))} at ${time(a.decided_at)}${a.edited_by ? " after editing the draft" : ""} · ${a.kind === "email" ? "in Outbox (mock)" : a.kind === "meeting" ? "see Calls" : "done"}</div>`;
  else foot = `<div class="muted">✖ Rejected by ${esc(personName(a.decided_by))} at ${time(a.decided_at)}${a.reason ? " · “" + esc(a.reason) + "”" : ""}</div>`;
  return `<div class="proposal"><div class="row"><span class="tag ${esc(a.status)}">${esc(a.status)}</span><b>${esc(kind)}</b> · ${esc(a.title)}${sample}</div>
    <div class="muted" style="font-size:13px;margin-top:6px">Decides: <b>${esc(a.approver_name)}</b> · ${esc(a.origin)} · ${time(a.created_at)}</div>
    <div class="muted" style="font-size:13px;margin-top:4px">Why: ${esc(a.why)}</div>${chips(a.sources)}
    ${warnBox(a.warnings, "Self-check: read this carefully before you approve")}${body}${foot}</div>`;
}

  const u = S.llm;

    [...S.log].reverse().map(a => `<tr><td>${a.id}</td><td>${time(a.at)}</td><td>${esc(personName(a.actor))}</td><td>${esc(a.event)}</td><td>${esc(a.detail)}</td><td>${(a.refs || []).slice(0, 4).map(r => `<span class="chip" data-ref="${esc(r)}">${esc(r)}</span>`).join(" ")}</td></tr>`).join("") + `</table>`);
}

/* ---------------------------------------------------------------- jury checklist */
function renderJury() {
  setHead("Jury checklist", "Run the seven checks, then the two extras only this mix has.");
  const checks = [
    {n: "1", title: "It speaks first", do: "Run the morning sweep, then open Brain DM.", buttons: [["sweep", "Run morning sweep"], ["dm", "Open Brain DM"]], expected: "An unprompted, role-specific morning brief appears before anyone asks."},
    {n: "2", title: "People curate memory", do: "As Davide, open Memory review: approve mem-p01, reject mem-p02 (the red box says 83,000 is not in its source). Then ask “When does the Langhe fix roll out?”", buttons: [["memory-davide", "Review as Davide"], ["rollout-davide", "Ask as Davide"]], expected: "Before approval: “I don't know”. After: Thursday 26 Nov at 07:00, citing the approved note."},
    {n: "3", title: "It knows who is asking", do: "Ask “What is our cash runway?” as Giulia, then as Sara.", buttons: [["runway-giulia", "Ask as Giulia"], ["runway-sara", "Ask as Sara"]], expected: "Giulia gets the approved answer; Sara is told it is not for her role."},
    {n: "4", title: "It cites", do: "Look at the chips and the word-for-word approved fact under every answer.", buttons: [["dm", "Open Brain DM"]], expected: "Every answer shows its sources; click a chip to open it."},
    {n: "5", title: "It admits gaps", do: "Ask: “What's the office Wi-Fi password?”", buttons: [["wifi", "Ask about Wi-Fi"]], expected: "“I don't know”, with no citation."},
    {n: "6", title: "It only proposes", do: "As Luca, open Approvals, edit the SensorParts draft, check the Outbox is empty, then approve.", buttons: [["approvals-luca", "Open Approvals as Luca"], ["outbox-luca", "Check Outbox"]], expected: "The draft waits for Luca; the Outbox stays empty until he approves."},
    {n: "7", title: "It fits the day", do: "Open Brain DM, the Morning email, and play the voice brief.", buttons: [["dm", "Brain DM"], ["email", "Morning email"], ["voice", "Play voice brief"]], expected: "The same sourced brief fits chat, email and voice."},
    {n: "★", title: "It phones the CEO", do: "Simulate “URGENT: frost tonight” and open Elena's Calls. Answer the call, then approve the fix and the meeting on the call screen.", buttons: [["urgent", "Simulate the urgent email"], ["calls-elena", "Open Elena's calls"]], expected: "The Brain rings Elena with a short script, prepares a message to Davide and a meeting, and does nothing until she approves.", star: true},
    {n: "↗", title: "Try to break it", do: "Paste your own email (a fraud request, a reworded injection) as any person.", buttons: [["paste", "Paste an email…"]], expected: "Flagged, no memory, no action, no call. A person is always the last line of defence."},
  ];
  setView(`<section class="jury-intro"><div class="eyebrow">The live walkthrough</div><h1>Trust, demonstrated.</h1><p>Seven checks. Real controls. A call to the CEO that still waits for a click.</p></section><div class="jury-grid">` + checks.map(c => `<div class="card ${c.star ? "star" : ""}"><div class="row"><span class="check-number">${esc(c.n)}</span><b>${esc(c.title)}</b></div>
    <div class="why"><b>Do:</b> ${esc(c.do)}</div><div class="row" style="margin-top:8px">${c.buttons.map(([a, l]) => `<button data-jury="${esc(a)}">${esc(l)}</button>`).join("")}</div>
    <div class="muted" style="margin-top:7px"><b>Look for:</b> ${esc(c.expected)}</div></div>`).join("") + `</div>`);
}

/* ---------------------------------------------------------------- agent trace */
function renderRuns() {
  $("#runs").innerHTML = S.runs.length ? S.runs.map(r => `<div class="run ${r.id === activeRun ? "active" : ""}" data-run="${esc(r.id)}"><span>${{ask: "💬", brief: "☀️", draft: "✉", ingest: "📥", call: "📞"}[r.agent] || "•"} ${esc(r.agent)} · ${esc(r.trigger.slice(0, 28))}</span><span class="muted">${r.mode === "gemini" ? "G" : "off"} · ${(r.ms / 1000).toFixed(1)}s</span></div>`).join("") : `<div class="muted" style="font-size:12px;padding:4px">No runs yet.</div>`;
  if (!activeRun && S.runs.length) showRun(S.runs[0].id); else if (activeRun) showRun(activeRun);
}
function showRun(id) {
  const r = S.runs.find(x => x.id === id); if (!r) return;
  activeRun = id; document.querySelectorAll(".run").forEach(e => e.classList.toggle("active", e.dataset.run === id));
  const icon = {trigger: "▶", tool_call: "→", tool_result: "←", guard: "!", fallback: "↯", model_text: "✎", final: "✓"};
  $("#steps").innerHTML = r.steps.map(s => `<div class="step ${s.kind}"><div class="k">${icon[s.kind] || "·"}</div><div><div class="n">${esc(s.note)}</div></div></div>`).join("");
  const u = r.usage;
  $("#usage").innerHTML = `${esc(r.mode === "gemini" ? (r.model || "gemini") : "offline rules")} · ${u.input_tokens} in / ${u.output_tokens} out tokens · <b>$${Number(u.cost_usd || 0).toFixed(4)}</b> · ${(r.ms / 1000).toFixed(1)}s`;
}
function toggleTrace(open) { $(".app").classList.toggle("trace-open", open); $("#traceToggle").setAttribute("aria-expanded", String(open)); }

/* ---------------------------------------------------------------- the call to the CEO */
function drawOrb(canvas) {
  cancelAnimationFrame(orbRaf);
  const ctx = canvas.getContext("2d"), W = canvas.width; let t = 0, level = 0.1;
  const frame = () => {
    t += 0.03; level += ((orbSpeaking ? 0.55 + 0.45 * Math.sin(t * 5.3) * Math.sin(t * 2.1) : 0.12) - level) * 0.12;
    ctx.clearRect(0, 0, W, W); const c = W / 2, R = W * (0.27 + level * 0.1);
    const g = ctx.createRadialGradient(c, c, R * 0.2, c, c, W * 0.5); g.addColorStop(0, `rgba(90,150,255,${0.35 + level * 0.4})`); g.addColorStop(1, "rgba(90,150,255,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, W);
    const core = ctx.createRadialGradient(c - R * 0.3, c - R * 0.3, R * 0.1, c, c, R); core.addColorStop(0, "#d6e6ff"); core.addColorStop(0.5, "#5b8cff"); core.addColorStop(1, "#243e9c");
    ctx.beginPath(); ctx.arc(c, c, R, 0, 7); ctx.fillStyle = core; ctx.fill();
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(c, c, R * 1.25, R * (0.35 + 0.1 * i), t * (0.6 + 0.3 * i) + i, 0, 7); ctx.strokeStyle = `rgba(190,215,255,${0.25 + level * 0.4})`; ctx.lineWidth = 1.5; ctx.stroke(); }
    orbRaf = requestAnimationFrame(frame);
  };
  frame();
}
function renderCall() {
  const layer = $("#callLayer"), acts = Object.fromEntries(S.actions.map(a => [a.id, a]));
  const c = S.calls.find(x => (x.status === "ringing" && !dismissed.has(x.id)) || (x.status === "answered" && layer.dataset.open === x.id));
  if (!c) { if (layer.classList.contains("on")) { layer.classList.remove("on"); cancelAnimationFrame(orbRaf); layer.innerHTML = ""; callSig = ""; } return; }
  const sig = c.id + c.status + c.actions.map(id => acts[id]?.status).join(",");
  if (sig === callSig) return; callSig = sig; layer.dataset.open = c.id; layer.classList.add("on");
  const src = S.sources.find(s => s.id === c.source);
  if (c.status === "ringing") {
    layer.innerHTML = `<div class="phone"><canvas class="orb" id="orb" width="340" height="340"></canvas><div class="who">Incoming call · Company Brain</div><h2>${esc(S.me.name.split(" ")[0])}, something urgent came in</h2>
      <div class="why">${esc(src ? src.title : c.source)}</div><div class="row" style="margin-top:20px;gap:18px"><button class="answer" data-call-answer="${esc(c.id)}">📞 Answer</button><button class="decline" data-call-decline="${esc(c.id)}">Decline</button></div>
      <p class="who" style="margin-top:16px">A call only informs. Nothing happens until you approve it.</p></div>`;
  } else {
    layer.innerHTML = `<div class="phone"><canvas class="orb" id="orb" width="340" height="340"></canvas><div class="who"><span class="live-dot"></span>Call in progress · Company Brain</div><h2>${esc(src ? src.title : c.source)}</h2><div class="why">${esc(c.why)}</div>
      <div class="script">${esc(c.script)}</div><div class="row"><button data-speak="${esc(c.id)}">🔊 Hear it again</button><button class="decline" data-call-end="${esc(c.id)}">Hang up</button></div>
      <div class="fixes"><div class="who" style="margin:14px 0 6px">What the Brain prepared. Tap to approve here, never by voice:</div>${c.actions.map(id => acts[id] ? actionBox(acts[id]) : "").join("") || '<div class="who">Nothing to approve.</div>'}</div></div>`;
  }
  drawOrb($("#orb"));
}
async function speak(id) {
  const text = speech[id] || (S.calls.find(c => c.id === id) || {}).script || "";
  orbSpeaking = true; if (curAudio) { curAudio.pause(); curAudio = null; } speechSynthesis.cancel();
  try {
    const r = await fetch("/api/voice", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({user: person, id})});
    if (r.ok) { const a = curAudio = new Audio(URL.createObjectURL(await r.blob())); a.onended = () => { orbSpeaking = false; }; await a.play(); return; }
  } catch {}
  try { const u = new SpeechSynthesisUtterance(text); u.lang = "en-GB"; u.onend = () => { orbSpeaking = false; }; u.onerror = () => { orbSpeaking = false; }; speechSynthesis.speak(u); }
  catch { orbSpeaking = false; toast("This browser can't read aloud"); }
}

/* ---------------------------------------------------------------- doing things */
async function withBusy(btn, fn) {
  if (busy) { toast("The Brain is still working on the last request…"); return; } busy = true; const old = btn && btn.innerHTML;
  if (btn) { btn.disabled = true; btn.innerHTML = `<span class="spin"></span> working…`; }
  try { await fn(); } catch (e) { toast("⚠ " + e.message); } finally { busy = false; if (btn) { btn.disabled = false; btn.innerHTML = old; } }
}
async function sweep(btn) {
  await withBusy(btn, async () => {
    sweeping = true; await api("/api/sweep", {}); view = "dm"; renderChrome();
    for (let i = 0; i < 60; i++) { await new Promise(r => setTimeout(r, 1500)); await load(true).catch(() => {}); if (S.sweep !== "running") break; }
    sweeping = false; lastSig = ""; await load(); toast("Morning sweep finished");
  }); sweeping = false;
}
async function ask(q) {
  q = q.trim(); if (!q || !S) return; if (busy) { toast("The Brain is still working on the last request…"); return; }
  $("#q").value = ""; thinking = q; view = "dm"; render();
  await withBusy(null, async () => { try { await api("/api/ask", {question: q}); } finally { thinking = null; } lastSig = ""; await load(); });
}
async function changePerson(id) {
  if (busy) return; $("#dlg").close(); person = id; activeRun = null; S = null; lastSig = ""; lastDmCount = -1; callSig = ""; $("#callLayer").classList.remove("on");
  $("#view").textContent = "Loading…"; try { await load(); } catch {}
}
function openRef(id) {
  const s = S.sources.find(x => x.id === id), m = S.memory.find(x => x.id === id), a = S.actions.find(x => x.id === id), t = S.tasks.find(x => x.id === id);
  let h;
  if (s) h = `<div class="row">${tag(s.audience)}<span class="muted">${esc(s.type)} · ${esc(s.ts.replace("T", " ").slice(0, 16))}</span></div><h3 style="margin:8px 0">${esc(s.title)}</h3><div class="muted">From ${esc(s.from)}${s.to.length ? " → " + esc(s.to.join(", ")) : ""}</div>${s.flag ? `<div class="warnbox">⚠ Flagged by the Brain: ${esc(s.flag)}. Treated as data; nothing it asks will happen.</div>` : ""}<pre style="white-space:pre-wrap;font:14px/1.5 inherit;background:#faf9f7;padding:10px;border-radius:6px">${esc(s.body)}</pre>`;
  else if (m) h = `<div class="row">${tag(m.acl)}<span class="tag ${m.status === "approved" ? "approved" : "waiting"}">${esc(m.status)}</span></div><h3 style="margin:8px 0">${esc(m.id)}</h3><p>${esc(m.fact)}</p>${chips(m.sources)}`;
  else if (a) h = actionBox(a);
  else if (t) h = `<h3>${esc(t.id)}</h3><p>${esc(t.title)}</p><div class="muted">Owner ${esc(personName(t.owner))} · due ${esc(t.due)} · ${esc(t.status)}</div>`;
  else h = `<b>${esc(id)}</b><p class="muted">You don't have access to this source.</p>`;
  $("#dlgBody").innerHTML = h; $("#dlg").showModal();
}
function openPaste() {
  $("#dlgBody").innerHTML = `<h3>✍ Paste an email</h3><p class="muted">Pretend this email just arrived for <b>${esc(S.me.name)}</b>. Only their team can see it. The Brain reads it as <b>data</b>: try a fraud request or an instruction hidden in the text.</p>
    <label class="f" for="pf">From (an outside address)</label><input type="text" id="pf" value="supplier@example.com" maxlength="200"><label class="f" for="ps">Subject</label><input type="text" id="ps" maxlength="200" placeholder="Subject"><label class="f" for="pb">Message</label><textarea id="pb" maxlength="2000" placeholder="Write or paste the email…"></textarea>
    <div class="row" style="margin-top:12px"><button class="primary" id="pastego">Deliver it</button></div>`;
  $("#dlg").showModal();
}
async function simulate(id) {
  if (!id) return;
  await withBusy(null, async () => {
    const r = await api("/api/simulate", {id}); view = r.call ? "calls" : "dm"; if (r.call) person = "elena";
    activeRun = null; lastSig = ""; await load();
    toast(r.call ? "The Brain is phoning the CEO (Elena)…" : r.level === "danger" ? "Flagged as suspicious: nothing was done" : "Message received and processed");
  });
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-view],[data-run],[data-ref],[data-mem],[data-act],[data-q],[data-speak],[data-jury],[data-showall],[data-call-open],[data-call-answer],[data-call-decline],[data-call-end],[data-dial],#pastego");
  if (!t) return;
  const d = t.dataset;
  if (d.jury) {
    const go = v => { view = v; render(); };
    const as = async (id, v, q) => { await changePerson(id); if (v) go(v); if (q) await ask(q); };
    const a = d.jury;
    if (a === "sweep") return sweep(t);
    if (a === "dm" || a === "email") return go(a);
    if (a === "memory-davide") return as("davide", "memory");
    if (a === "rollout-davide") return as("davide", "dm", "When does the Langhe fix roll out?");
    if (a === "runway-giulia") return as("giulia", "dm", "What is our cash runway?");
    if (a === "runway-sara") return as("sara", "dm", "What is our cash runway?");
    if (a === "wifi") { go("dm"); return ask("What's the office Wi-Fi password?"); }
    if (a === "approvals-luca") return as("luca", "approvals");
    if (a === "outbox-luca") return as("luca", "outbox");
    if (a === "voice") { const b = latestBrief(); return b ? speak(b.id) : toast("Run the morning sweep first"); }
    if (a === "urgent") return simulate("email-103");
    if (a === "calls-elena") return as("elena", "calls");
    if (a === "paste") return openPaste();
  }
  if (d.speak) return speak(d.speak);
  if (d.run) { e.preventDefault(); toggleTrace(true); activeRun = d.run; return showRun(d.run); }
  if (d.view) { view = d.view; return render(); }
  if (d.showall) { showAllMem = !showAllMem; return render(); }
  if (d.q) return ask(d.q);
  if (d.ref) return openRef(d.ref);
  if (d.callOpen) { dismissed.delete(d.callOpen); callSig = ""; renderCall(); return; }
  if (d.callAnswer) return withBusy(t, async () => { await api("/api/call/answer", {id: d.callAnswer}); callSig = ""; lastSig = ""; await load(); speak(d.callAnswer); });
  if (d.callDecline) return withBusy(t, async () => { await api("/api/call/end", {id: d.callDecline, decision: "declined"}); dismissed.add(d.callDecline); $("#callLayer").dataset.open = ""; callSig = ""; lastSig = ""; await load(); });
  if (d.callEnd) return withBusy(t, async () => { orbSpeaking = false; speechSynthesis.cancel(); if (curAudio) curAudio.pause(); await api("/api/call/end", {id: d.callEnd}); $("#callLayer").dataset.open = ""; callSig = ""; lastSig = ""; await load(); });
  if (d.dial) return withBusy(t, async () => { await api("/api/call/dial", {id: d.dial}); lastSig = ""; await load(); toast("Dialing your real phone…"); });
  if (d.mem) return withBusy(t, async () => { try { await api("/api/memory", {id: d.mem, decision: d.d, reason: reasons[d.mem] || ""}); delete reasons[d.mem]; toast(d.d === "approve" ? "Approved: the Brain can now use it" : "Rejected: it will never be used"); } finally { lastSig = ""; await load(); } });
  if (d.act) return withBusy(t, async () => {
    const ta = document.querySelector(`textarea[data-draft="${d.act}"]`);
    try { await api("/api/action", {id: d.act, decision: d.d, body: ta ? ta.value : null, reason: reasons[d.act] || ""}); delete drafts[d.act]; delete reasons[d.act]; callSig = ""; toast(d.d === "approve" ? "Approved and logged" : "Rejected and logged"); } finally { lastSig = ""; await load(); }
  });
  if (t.id === "pastego") return withBusy(t, async () => {
    const r = await api("/api/inbound", {from: $("#pf").value, subject: $("#ps").value, body: $("#pb").value});
    $("#dlg").close(); view = "dm"; lastSig = ""; await load(); toast(r.call ? "The Brain is phoning the CEO…" : r.level === "danger" ? "Flagged as suspicious: nothing was done" : "Delivered: the Brain read it");
  });
});
document.addEventListener("input", e => { if (e.target.dataset.draft) drafts[e.target.dataset.draft] = e.target.value; if (e.target.dataset.reason) reasons[e.target.dataset.reason] = e.target.value; });
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("nav a")) { e.preventDefault(); e.target.click(); } if (e.key === "Escape") toggleTrace(false); });
$("#traceToggle").addEventListener("click", () => toggleTrace(!$(".app").classList.contains("trace-open")));
$("#closeTrace").addEventListener("click", () => toggleTrace(false));
$("#askForm").addEventListener("submit", e => { e.preventDefault(); ask($("#q").value); });
$("#sweepBtn").addEventListener("click", e => sweep(e.currentTarget));
$("#pasteBtn").addEventListener("click", () => S && openPaste());
$("#personSel").addEventListener("change", e => changePerson(e.target.value));
$("#eventSel").addEventListener("change", e => { const id = e.target.value; e.target.value = ""; simulate(id); });
$("#resetBtn").addEventListener("click", () => { if (!confirm("Reset the demo to its starting data?")) return; withBusy(null, async () => { await api("/api/reset", {}); Object.keys(drafts).forEach(k => delete drafts[k]); activeRun = null; view = "dm"; lastSig = ""; lastDmCount = -1; dismissed.clear(); await new Promise(r => setTimeout(r, 800)); await load(); toast("Demo reset"); }); });
load().catch(() => {});
setInterval(() => { if (!busy && !document.hidden) load(true).catch(() => {}); }, 3000);
</script>
