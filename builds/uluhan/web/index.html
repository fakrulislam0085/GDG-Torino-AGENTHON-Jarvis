<style>

size:14px;font-weight:500;cursor:pointer;text-decoration:none}nav a>span:first-child{display:flex;gap:11px;align-items:center}nav a:hover{background:#f6f8fc}nav a.active{background:var(--accent-soft);color:var(--accent);font-weight:650}.nav-label{white-space:nowrap}.nav-icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}nav .badge{font-size:11px;min-width:21px;border-radius:5px;text-align:center;background:#e8edf7;color:#687995;padding:0 5px}nav a.active .badge{background:#dce6ff;color:var(--accent)}.nav-foot{margin-top:auto;padding:26px 12px 6px;font-size:12px;color:var(--muted)}.nav-foot strong{color:var(--ink);display:block;font-size:13px}
main{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}main .head{display:flex;align-items:center;gap:12px;padding:20px 38px;border-bottom:1px solid var(--line);background:#ffffffb5;min-height:80px}main .head h2{font-size:18px;letter-spacing:-.5px;margin:0;font-weight:650}main .head .sub{font-size:13px;color:var(--muted);flex:1}.trace-toggle{font-size:12px;color:var(--muted);padding:7px 10px;white-space:nowrap}.scroll{flex:1;overflow:auto;padding:32px 38px 24px;scroll-behavior:smooth}#view>*{max-width:1080px;margin-left:auto;margin-right:auto}.welcome{margin-bottom:30px!important;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent)}.welcome h1,.jury-intro h1{font-size:36px;line-height:1.15;letter-spacing:-1.4px;font-weight:650;margin:9px 0}.welcome p,.jury-intro p{color:var(--muted);margin:0;font-size:14px}.welcome .summary{display:flex;gap:24px;padding:12px 0}.summary div{font-size:12px;color:var(--muted);white-space:nowrap}.summary strong{display:block;font-size:24px;line-height:1.3;color:var(--ink);font-weight:600;letter-spacing:-.8px}.msg{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;margin-bottom:24px}.av{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--accent);color:white;font-size:13px;font-weight:700}.av.me{background:#e0e7f3;color:#5f708c}.meta{font-size:13px;margin-bottom:7px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}.meta span{font-size:12px;color:var(--muted)}.meta a{color:var(--muted);text-decoration:underline;text-underline-offset:3px}.card{border:1px solid var(--line);border-radius:14px;background:white;padding:22px 24px;margin-top:6px;box-shadow:0 3px 12px #182c4b03}.card.answered{border-left:3px solid var(--ok)}.card.unknown,.card.restricted{background:#f0f3f8;border-color:#e2e7ef}.card.conflict{border:1px solid #e8d5ad;border-top:3px solid #c38f34;background:#fff}.card.suspicious{border-color:#eac7c1;background:var(--bad-soft)}.item{padding:20px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}.item .hl{font-weight:650;font-size:16px}.item .why{color:#66758c;margin-top:5px;font-size:14px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.chip{display:inline-block;cursor:pointer;border-radius:6px;padding:4px 8px;font-size:12px;color:#677995;background:#f3f6fb;border:1px solid #e8edf5}.chip:hover{background:var(--accent-soft);border-color:#b3c7ff;color:var(--accent)}.tag{display:inline-block;border-radius:5px;padding:3px 7px;font-size:12px;font-weight:600}.tag.finance,.tag.tech{background:#edf2ff;color:#536caa}.tag.all{background:#eef2f6;color:#66758c}.tag.pending{background:var(--warn-soft);color:var(--warn)}.tag.approved{background:var(--ok-soft);color:var(--ok)}.tag.rejected,.tag.superseded,.tag.withdrawn{background:#f0f2f6;color:#7a8596}.proposal{border:1px solid #e9d8b8;background:#fffaf1;border-radius:10px;padding:18px;margin:16px 0 0;font-size:14px}.proposal pre{background:#fff;border:1px solid #eee5d5;border-radius:8px;padding:14px;white-space:pre-wrap;font:14px/1.6 inherit}.draft-preview{margin:12px 0}.draft-preview summary{cursor:pointer;font-size:14px;font-weight:600}.proposal>.row:last-child{margin-top:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:var(--muted)}.empty{border:1px dashed #ccd7e9;border-radius:14px;padding:40px 24px;text-align:center;color:var(--muted);background:#ffffff80}.quote{border-left:2px solid #cbd5e6;padding:6px 12px;margin:12px 0;color:var(--muted);font-size:14px}.composer{background:#fff;border-top:1px solid var(--line);padding:16px 38px 20px}.composer form{display:flex;gap:10px;max-width:1080px;margin:auto}.composer input{min-width:0;flex:1;background:#f7f9fc;border:1px solid #e1e7f0;border-radius:10px;padding:13px 16px;font-size:15px}.composer button.primary{padding:10px 24px}.suggest{display:flex;gap:7px;flex-wrap:wrap;margin:0 auto 12px;max-width:1080px}.suggest button{padding:5px 9px;border-radius:6px;font-size:12px;font-weight:450;color:#6b7c95;background:#fff}.composer-note{font-size:11px;text-align:center;color:#8a96a9;margin-top:9px}
aside{display:none;position:absolute;right:0;top:0;bottom:0;width:340px;background:#fff;border-left:1px solid var(--line);z-index:4;box-shadow:-12px 0 32px #17243c0a;flex-direction:column;min-height:0}.trace-open aside{display:flex}.trace-open{grid-template-columns:224px minmax(0,1fr) 340px}.trace-open main{grid-column:2}.trace-open nav{grid-column:1}aside .head{padding:20px;border-bottom:1px solid var(--line)}aside .head h3{margin:0 0 4px;font-size:16px}.runs{padding:12px;border-bottom:1px solid var(--line);max-height:28%;overflow:auto}.run{padding:9px;border-radius:7px;font-size:12px;display:flex;justify-content:space-between;gap:7px;cursor:pointer}.run:hover,.run.active{background:var(--accent-soft)}.steps{padding:18px;overflow:auto;flex:1}.step{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;font-size:12px;margin-bottom:14px}.step .k{width:20px;height:20px;background:#c9d2df;color:#fff;border-radius:6px;display:grid;place-items:center;font-size:11px}.step.tool_call .k{background:var(--accent)}.step.guard .k{background:var(--bad)}.step.tool_result .k{background:var(--ok)}.step details{margin-top:4px}.step pre{font:11px/1.5 var(--mono);word-break:break-word;white-space:pre-wrap;max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px;background:#f6f8fc}.usage{font-size:12px;padding:15px;color:var(--muted);border-top:1px solid var(--line)}table{width:100%;border-collapse:collapse;background:#fff;font-size:14px}th,td{padding:13px 16px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);font-weight:600;background:#f8faff}dialog{width:min(640px,92vw);border:1px solid var(--line);border-radius:18px;padding:28px;color:var(--ink);box-shadow:0 24px 80px #17243c30}dialog pre,.proposal pre{font-family:inherit;line-height:1.6}dialog::backdrop{background:#12254266;backdrop-filter:blur(4px)}
.receipt{margin-top:16px}.receipt .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.receipt .col{background:#f7f9fc;border:1px solid #e3e8f0;border-radius:10px;padding:20px}.receipt .col.keep{background:var(--ok-soft);border-color:#bddfcc}.receipt .col.claim{background:#faf6f5;border-color:#e4d4d1}.receipt .lbl{font-size:11px;letter-spacing:.9px;text-transform:uppercase;font-weight:700;color:var(--muted)}.receipt .keep .lbl{color:var(--ok)}.receipt .val{font-size:15px;line-height:1.8;margin:10px 0}.receipt .amt{font-size:25px;font-weight:700;letter-spacing:-.8px;color:var(--ink);white-space:nowrap}.receipt .amt~.amt{font-size:inherit;font-weight:inherit;letter-spacing:inherit}.receipt .claim .amt{text-decoration:line-through;text-decoration-color:#b6807a;color:#9a7470}.receipt ul{padding-left:20px;margin:10px 0;font-size:14px;color:var(--muted)}.receipt .status{display:inline-block;font-size:12px;font-weight:650;border-radius:6px;padding:5px 9px;margin-top:16px}.receipt .status.kept,.receipt .status.changed{background:var(--ok-soft);color:var(--ok)}.receipt details{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}.receipt summary{cursor:pointer;font-size:14px;font-weight:600}.decision-heading{font-size:18px;font-weight:650;letter-spacing:-.3px}.brief-label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px}.jury-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.jury-grid>.card{margin:0;display:flex;flex-direction:column;gap:9px}.jury-grid .why{font-size:14px;color:var(--muted)}.jury-grid .row:last-of-type{margin-top:auto!important;padding-top:8px}.jury-grid .star{grid-column:1/-1;border-color:#cbd8ff;background:linear-gradient(120deg,#fff,#f0f4ff)}.jury-intro{margin-bottom:28px!important}.jury-grid .check-number{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:700}.jury-grid .muted{font-size:13px!important}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);border:1px solid #364969;border-radius:10px;padding:12px 18px;background:#1b2e4b;color:#fff;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;box-shadow:0 8px 30px #17243c25}.toast.on{opacity:1}.spin{display:inline-block;border:2px solid #93a8e5;border-top-color:white;border-radius:50%;width:13px;height:13px;animation:s .8s linear infinite}.thinking{color:var(--muted);font-size:14px}@keyframes s{to{transform:rotate(360deg)}}
@media(min-width:1500px){.app.trace-open{grid-template-columns:224px minmax(0,1fr) 340px}}
@media(max-width:1300px){header{gap:12px}.header-identity,.header-actions{width:100%}.header-identity .brand{margin-right:auto}.header-actions label{margin-left:auto}.header-identity>.demo-label{display:none}}
@media(max-width:1200px){header{padding:12px 18px;gap:8px}.header-identity>.demo-label{display:none}header .brand{font-size:16px;margin-right:auto}header .spacer{display:none}header label{margin-left:auto}.app{grid-template-columns:200px minmax(0,1fr)}.trace-open{grid-template-columns:200px minmax(0,1fr)}.scroll{padding:24px}main .head{padding:18px 24px}.composer{padding:14px 24px}main .head .sub{display:none}.trace-toggle{margin-left:auto}}
@media(max-width:760px){.header-identity{flex-wrap:wrap}.header-actions{gap:8px}header{padding:12px 14px}header .brand{flex:1}header #mode{font-size:11px}header #sweepBtn{order:2}header #eventSel{order:3;flex:1;max-width:100%;min-width:130px}header label{order:4;font-size:0}header label select{font-size:12px;max-width:170px}header #resetBtn{order:5}.app,.trace-open{grid-template-columns:68px minmax(0,1fr)}nav{padding:18px 8px}nav .ws,nav .who,nav .sec,nav .nav-foot,nav .nav-label,nav .badge{display:none}nav a{padding:13px;justify-content:center}nav a>span:first-child{gap:0}.scroll{padding:20px 14px}main .head{padding:16px 14px;min-height:65px}main .head h2{font-size:16px}.welcome{display:block}.welcome h1,.jury-intro h1{font-size:28px}.welcome .summary{gap:28px}.msg{grid-template-columns:minmax(0,1fr);gap:6px}.msg>.av{display:none}.card{padding:18px}.receipt .cols{grid-template-columns:1fr}.receipt .col{padding:16px}.receipt .amt{font-size:23px}.composer{padding:12px 14px}.suggest{max-height:70px;overflow:auto}.composer-note{display:none}.jury-grid{grid-template-columns:1fr}aside{width:min(340px,calc(100vw - 68px))}.trace-open main{grid-column:2}.summary strong{font-size:23px}table{display:block;overflow:auto}header .pill{max-width:180px;overflow:hidden;text-overflow:ellipsis}}

<body>
<header>
  <div class="header-identity"><span class="brand"><span class="brand-mark">f</span><span>Company Brain<small>FILARE WORKSPACE</small></span></span>
  <span class="pill demo-label" title="All companies, people and messages are fictional">Synthetic demo</span>
  <span class="pill" id="mode">…</span>
  <span class="pill" id="clock">…</span>
  </div><div class="header-actions">
  <button id="sweepBtn" title="The scheduled background job. Nobody asks the brain anything.">⏰ Run morning sweep</button>
  <select id="eventSel" title="Simulate an email arriving"><option value="">✉ Simulate incoming email…</option></select>
  <label class="row" style="gap:6px">Viewing as
    <select id="personSel"></select>
  </label>
  <button class="ghost" id="resetBtn">Reset</button></div>
</header>
<div class="app">
  <nav id="nav"></nav>
  <main>
    <div class="head"><h2 id="title"></h2><span class="sub" id="subtitle"></span><button class="trace-toggle" id="traceToggle" aria-expanded="false" aria-controls="tracePanel">Agent trace</button></div>
    <div class="scroll" id="view"></div>
    <div class="composer" id="composer">
      <div class="suggest" id="suggest"></div>
      <form id="askForm"><input id="q" autocomplete="off" placeholder="Ask a question. Get an approved, sourced answer." aria-label="Ask the brain"><button class="primary">Ask</button></form><div class="composer-note">Approved knowledge only. Your access is checked before every answer.</div>
    </div>
  </main>
  <aside id="tracePanel">
    <div class="head"><div class="row" style="justify-content:space-between"><h3>Agent trace</h3><button id="closeTrace" aria-label="Close agent trace">×</button></div><div class="muted" style="font-size:12px">Every tool call, every refused action, and what it cost.</div></div>
    <div class="runs" id="runs"></div>
    <div class="steps" id="steps"><div class="empty">Run the sweep or ask a question.</div></div>
    <div class="usage" id="usage"></div>
  </aside>
</div>
<dialog id="dlg"><div id="dlgBody"></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button onclick="dlg.close()">Close</button></div></dialog>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SUGGEST = ["When does the Langhe fix roll out?", "What is our cash runway?",
  "What is the Q1 2027 cloud budget?", "What is our Q2 2027 cloud budget?"];
let S = null, person = location.hash.slice(1) || "luca", view = "dm", activeRun = null, busy = false;
const chats = new Map();

function conversation(id) {
  if (!chats.has(id)) chats.set(id, []);
  return chats.get(id);
}

async function api(path, opts = {}) {
  const {timeout, ...request} = opts;
  const controller = timeout ? new AbortController() : null;
  const timer = controller ? setTimeout(() => controller.abort(), timeout) : null;
  try {
    const r = await fetch(path, {headers: {"Content-Type": "application/json"}, ...request,
      signal: controller?.signal, body: request.body ? JSON.stringify(request.body) : undefined});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || r.statusText);
    return j;
  } catch (error) {
    if (error.name === "AbortError") throw new Error("The sweep exceeded 75 seconds; the demo is switching back to a responsive state.");
    throw error;
  } finally { if (timer) clearTimeout(timer); }
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 2600); }
const tag = a => (a || []).map(x => `<span class="tag ${esc(x)}">${esc(x)}</span>`).join(" ");
const time = c => esc((c || "").slice(11, 16));
const chips = cits => `<div class="chips">${(cits || []).map(c =>
  `<span class="chip" data-src="${esc(c.source_id)}" title="${esc(c.quote || c.source_title)}">📎 ${esc(c.id)} · ${esc(c.label)}</span>`).join("")}</div>`;

async function load() {
  const selected = person;
  let state;
  try {
    state = await api(`/api/state?person=${encodeURIComponent(selected)}`);
  } catch (error) {
    if (person === selected && error.message.startsWith("unknown person") && selected !== "luca") {
      person = "luca";
      return load();
    }
    throw error;
  }
  if (person === selected) {
    S = state;
    render();
  }
}

function render() {
  if (!S) return;
  $("#mode").textContent = S.mode === "gemini" ? `Gemini live · ${S.model}` : "Offline fallback (no model)";
  $("#mode").className = "pill " + S.mode; $("#mode").title = S.mode_note || "";
  location.hash = person;
  $("#clock").textContent = "🕗 " + S.clock.replace("T", " ");
  $("#personSel").innerHTML = S.people.map(p => `<option value="${p.id}" ${p.id === person ? "selected" : ""}>${esc(p.name)} · ${esc(p.title || p.role)}</option>`).join("");
  $("#sweepBtn").textContent = `⏰ Run ${S.sweep_label} sweep`;
  $("#eventSel").innerHTML = `<option value="">✉ Simulate incoming email…</option>` +
    S.pending_events.map(e => `<option value="${esc(e.id)}" ${e.allowed ? "" : "disabled"}>${e.allowed ? "" : "🔒 "}${esc(e.label)}${e.allowed ? "" : " — switch persona"}</option>`).join("");
  const pend = S.proposals.filter(p => p.status === "pending").length;
  const openAlerts = S.alerts.filter(a => !a.closed).length;
  const nav = [["dm", "🧠 Brain", (S.brief ? 0 : 0) + openAlerts], ["email", "📧 Morning email", S.brief ? 1 : 0], ["memory", "📚 Memory review", S.candidates.length],
    ["approvals", "✅ Approvals", pend], ["outbox", "📤 Outbox", 0], ["sources", "🗂 Sources", 0], ["audit", "🧾 Audit log", 0], ["jury", "🏁 Jury checklist", 0]];
  const iconPaths = {dm:'M4 4h16v12H9l-5 4V4Z',email:'M3 5h18v14H3V5Zm0 1 9 7 9-7',memory:'M4 4h7v16H4V4Zm9 0h7v16h-7V4Z',approvals:'m7 12 3 3 7-7 M5 3h14v18H5V3Z',outbox:'M4 14h4l2 3h4l2-3h4 M4 14l3-9h10l3 9v6H4v-6Z',sources:'M3 6h7l2 3h9v11H3V6Z',audit:'M6 3h12v18H6V3Zm3 5h6m-6 4h6m-6 4h4',jury:'M5 3v18m0-16h14l-3 4 3 4H5'};
  $("#nav").innerHTML = `<div class="ws">${esc(S.company.split(" (")[0])}</div><div class="who">Your company, in context.</div><div class="sec">Workspace</div>` + nav.map(([k, l, n], i) =>
    (i === 5 ? `<div class="sec">Knowledge & trust</div>` : "") +

function setHead(t, s) { $("#title").textContent = t; $("#subtitle").textContent = s; }

function proposalBox(p) {
  if (!p) return "";
  const btns = p.status === "pending"
    ? `<div class="row"><button class="ok" data-prop="${p.id}" data-act="approve">Approve to mock outbox</button><button data-prop="${p.id}" data-act="reject">Reject</button>
       <span class="muted">Nothing moves to the outbox until you approve.</span></div>`
    : p.status === "withdrawn"
      ? `<div class="muted">↩ Withdrawn by the brain at ${time(p.decided_at)}: the fact it quoted was replaced, so this draft is stale.</div>`
      : `<div class="muted">${p.status === "approved" ? "✅ Approved" : "✖ Rejected"} by ${esc(p.decided_by)} at ${time(p.decided_at)}${p.status === "approved" ? " · in Outbox (mock)" : ""}</div>`;
  return `<div class="proposal"><div class="row"><span class="tag ${esc(p.status)}">${esc(p.status)}</span><b>Draft email</b> to ${esc(p.to)}</div>
    <details class="draft-preview"><summary>Read draft · ${esc(p.subject)}</summary><pre>${esc(p.body)}</pre><div class="muted" style="font-size:12px">Why: ${esc(p.reason)}</div></details>${chips(p.citations)}${btns}</div>`;
}

const amounts = t => esc(t).replace(/((?:EUR|€)\s?\d{1,3}(?:[.,]\d{3})*)/g, '<span class="amt">$1</span>');
function receiptCard(a) {

  return `<div class="msg"><div class="av">f</div><div><div class="meta"><b>Brain</b><span>${time(a.created_at)} · change control, unprompted</span></div>
    <div class="card conflict"><div class="eyebrow">Change control</div><div class="decision-heading">${r.record_changed ? "A new decision. A clear record." : cl.status === "rejected" ? "Claim rejected. History preserved." : "A new claim needs a decision."}</div><div class="muted" style="font-size:14px;margin-top:4px">${r.record_changed ? "Accepted by an authorized reviewer." : "Incoming evidence stays separate from approved knowledge."}</div>
    <div class="receipt"><div class="cols">
      <div class="col ${cur.status === "approved" ? "keep" : ""}"><div class="lbl">Company record · ${cur.status === "approved" ? "approved" : esc(cur.status)}</div>
        <div class="val">${amounts(cur.fact)}</div>
        <div class="muted" style="font-size:12px">Approved by ${esc(cur.approved_by)} · ${esc(cur.approved_on)}</div>${srcChips(cur.sources)}</div>
      <div class="col ${activeClaim ? "keep" : cl.status === "rejected" ? "claim" : ""}"><div class="lbl">${activeClaim ? "Active company record" : "Incoming claim"} · ${esc(cl.status === "candidate" ? "not approved" : cl.status)}</div>
        <div class="val">${amounts(cl.fact)}</div>
        <div class="muted" style="font-size:12px">Dated ${esc(cl.dated)}</div>${srcChips(cl.sources)}</div>
    </div>
    <details><summary>Decision receipt · Why this outcome?</summary><ul>${r.reasons.map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>
    <div class="muted" style="font-size:12px;margin-top:4px">Can decide: ${r.reviewers.map(esc).join(", ")}</div>
    <span class="status ${r.record_changed ? "changed" : "kept"}">${r.record_changed ? "Record changed after review" : "✓ Record unchanged by this claim"}</span>
    <span class="muted" style="font-size:12px;margin-left:6px">${esc(r.outcome)}</span>
    ${r.you_can_reject ? `<div class="row" style="margin-top:8px"><button data-mem="${esc(cl.id)}" data-act="reject">Reject claim</button>
      ${r.you_can_approve ? `<button data-mem="${esc(cl.id)}" data-act="approve">Replace the record</button>` : `<span class="muted" style="font-size:12px">You can't replace this record.</span>`}</div>` : ""}
    </div></div></div></div>`;
}

  else {
    const b = S.brief;
    h += `<div class="msg"><div class="av">f</div><div><div class="meta"><b>Brain</b><span>${time(b.generated_at)} · morning brief, unprompted · <a href="#" data-run="${b.run_id}">trace</a></span></div>
      <div class="card">${S.voice ? `<div class="row" style="margin-bottom:6px"><button data-voice="1">🔊 Play voice brief</button><span class="muted" style="font-size:12px">ElevenLabs · read from this brief only</span></div>` : ""}<div><div class="brief-label">Morning brief · ${time(b.generated_at)}</div>Good morning ${esc(S.person.name.split(" ")[0])}. ${b.items.length ? `${b.items.length} thing${b.items.length > 1 ? "s" : ""} need${b.items.length > 1 ? "" : "s"} you today:` : "Nothing needs you today."}</div>

    else if (m.thinking) h += `<div class="msg"><div class="av">f</div><div class="thinking">Searching memory you're allowed to see…</div></div>`;
    else {

      h += `<div class="msg"><div class="av">f</div><div><div class="meta"><b>Brain</b><span>${time(m.clock)} · <a href="#" data-run="${m.run}">trace</a></span></div>
        <div class="card ${a.status}">${lbl ? `<b>${lbl}</b><br>` : ""}${esc(a.text)}${chips(a.citations)}
        ${(a.citations || []).filter(c => c.fact && c.fact !== a.text).map(c => `<div class="quote">Approved fact ${esc(c.id)}: ${esc(c.fact)}</div>`).join("")}</div></div></div>`;

}

async function showRun(id) {
  const selected = person;
  activeRun = id;
  document.querySelectorAll(".run").forEach(e => e.classList.toggle("active", e.dataset.run === id));
  let r;
  try { r = await api(`/api/runs/${id}?person=${encodeURIComponent(selected)}`); } catch { return; }
  if (person !== selected || activeRun !== id) return;
  const icon = {trigger: "▶", tool_call: "→", tool_result: "←", guard: "!", fallback: "↯", model_text: "✎", final: "✓"};
  $("#steps").innerHTML = r.steps.map(s => `<div class="step ${s.kind}"><div class="k">${icon[s.kind] || "·"}</div><div>
    <div class="n">${esc(s.note)} <span class="muted">${s.ms}ms</span></div>
    ${s.args || s.result ? `<details><summary class="muted">data</summary><pre>${esc(JSON.stringify(s.args || s.result, null, 1))}</pre></details>` : ""}</div></div>`).join("");
  const u = r.usage;
  $("#usage").innerHTML = `${esc(r.mode === "gemini" ? r.model : "offline planner")} · ${u.input_tokens} in / ${u.output_tokens} out tokens · <b>$${u.cost_usd.toFixed(4)}</b> · ${(r.ms / 1000).toFixed(1)}s`;
}

async function withBusy(btn, fn) {
  if (busy) { toast("The brain is still working on the last request…"); return; } busy = true; $("#personSel").disabled = true; const old = btn && btn.innerHTML;
  if (btn) { btn.disabled = true; btn.innerHTML = `<span class="spin"></span> working…`; }
  try { await fn(); } catch (e) { toast("⚠ " + e.message); } finally { busy = false; $("#personSel").disabled = false; if (btn) { btn.disabled = false; btn.innerHTML = old; } }
}
async function sweep(btn) {
  await withBusy(btn, async () => { const r = await api("/api/sweep", {method: "POST", timeout: 75000}); activeRun = null; view = "dm"; await load(); toast(`Sweep done: ${r.runs.length} agent runs`); });
}
async function playVoiceBrief() {
  const r = await fetch(`/api/brief/audio?person=${person}`);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  const url = URL.createObjectURL(await r.blob());
  const audio = new Audio(url);
  audio.addEventListener("ended", () => URL.revokeObjectURL(url), {once: true});
  try { await audio.play(); }
  catch (error) { URL.revokeObjectURL(url); throw new Error("Your browser blocked audio playback. Click Play voice brief again."); }
}
async function ask(q) {
  q = q.trim(); if (!q || !S) return; if (busy) { toast("The brain is still working on the last request…"); return; }
  const c = conversation(person); c.push({who: "me", text: q, clock: S.clock}); c.push({thinking: true}); $("#q").value = ""; renderDM();
  await withBusy(null, async () => {
    try { const r = await api("/api/ask", {method: "POST", body: {person, question: q}});
      c.pop(); c.push({who: "brain", answer: r.answer, run: r.run.id, clock: S.clock}); activeRun = r.run.id; }
    catch (e) { c.pop(); throw e; }
    await load(); showRun(activeRun);
  });
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-view],[data-view-go],[data-run],[data-src],[data-mem],[data-prop],[data-q],[data-voice],[data-jury],#sweep2");
  if (!t) return;
  if (t.dataset.jury) {
    const go = v => { view = v; render(); };
    const as = async (id, nextView, question) => {
      $("#personSel").value = id;
      await changePerson(id);
      if (nextView) go(nextView);
      if (question) await ask(question);
    };
    const action = t.dataset.jury;
    if (action === "sweep") return sweep(t);
    if (["dm", "email"].includes(action)) return go(action);
    if (action === "memory-sara") return as("sara", "memory");
    if (action === "rollout-sara") return as("sara", "dm", "When does the Langhe fix roll out?");
    if (action === "runway-giulia") return as("giulia", "dm", "What is our cash runway?");
    if (action === "runway-sara") return as("sara", "dm", "What is our cash runway?");
    if (action === "wifi") return ask("What is the office Wi-Fi password?");
    if (action === "approvals-luca") return as("luca", "approvals");
    if (action === "outbox-luca") return as("luca", "outbox");
    if (action === "voice") return withBusy(t, playVoiceBrief);
    if (action === "email-006") return withBusy(t, async () => { const r = await api("/api/events/email-006", {method: "POST"}); activeRun = r.runs[0]?.id || null; view = "dm"; await load(); toast(r.note || "Email received and processed"); });
    if (action === "mail-new") {
      await as("sara", "dm");
      return withBusy(t, async () => { const r = await api("/api/events/mail-new", {method: "POST"}); activeRun = r.runs[0]?.id || null; await load(); toast(r.note || "Synthetic claim received for review"); });
    }
    if (action === "budget-giulia") return as("giulia", "dm", "What is the Q1 2027 cloud budget?");
  }
  if (t.dataset.voice) return withBusy(t, playVoiceBrief);
  if (t.dataset.run) { e.preventDefault(); toggleTrace(true); return showRun(t.dataset.run); }
  if (t.dataset.view || t.dataset.viewGo) { view = t.dataset.view || t.dataset.viewGo; return render(); }
  if (t.dataset.q) return ask(t.dataset.q);
  if (t.id === "sweep2") return sweep(t);
  if (t.dataset.src) {
    const s = S.sources.find(x => x.id === t.dataset.src);
    $("#dlgBody").innerHTML = s ? `<div class="row">${tag(s.audience)}<span class="muted">${esc(s.type)} · ${esc(s.ts.replace("T", " "))}</span></div><h3 style="margin:8px 0">${esc(s.title)}</h3>
      <div class="muted">From ${esc(s.from)}${s.to ? " → " + esc(s.to) : ""}</div><pre style="white-space:pre-wrap;font:14px/1.5 inherit;background:#faf9f7;padding:10px;border-radius:6px">${esc(s.body)}</pre>`
      : `<b>${esc(t.dataset.src)}</b><p class="muted">You don't have access to this source.</p>`;
    return $("#dlg").showModal();
  }
  if (t.dataset.mem) return withBusy(t, async () => { await api(`/api/memory/${t.dataset.mem}/${t.dataset.act}`, {method: "POST", body: {person}}); toast(`${t.dataset.mem} ${t.dataset.act}d by ${S.person.name}`); await load(); });
  if (t.dataset.prop) return withBusy(t, async () => { await api(`/api/proposals/${t.dataset.prop}/${t.dataset.act}`, {method: "POST", body: {person}}); toast(t.dataset.act === "approve" ? "Approved: moved to Outbox (mock)" : "Rejected: nothing sent"); await load(); });
});
function toggleTrace(open) {
  $(".app").classList.toggle("trace-open", open);
  $("#traceToggle").setAttribute("aria-expanded", String(open));
}
$("#traceToggle").addEventListener("click", () => toggleTrace(!$(".app").classList.contains("trace-open")));
$("#closeTrace").addEventListener("click", () => toggleTrace(false));
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("nav a")) { e.preventDefault(); e.target.click(); }
  if (e.key === "Escape") toggleTrace(false);
});
$("#askForm").addEventListener("submit", e => { e.preventDefault(); ask($("#q").value); });
$("#sweepBtn").addEventListener("click", e => sweep(e.currentTarget));
async function changePerson(id) {
  if (busy) return;
  $("#dlg").close();
  $("#dlgBody").textContent = "";
  person = id;
  activeRun = null;
  S = null;
  $("#steps").textContent = "";
  $("#usage").textContent = "";
  $("#runs").textContent = "";
  $("#view").textContent = "Loading demo persona…";
  $("#eventSel").value = "";
  $("#eventSel").disabled = true;
  try { await load(); } catch (e) { toast(e.message); } finally { $("#eventSel").disabled = false; }
}
$("#personSel").addEventListener("change", e => changePerson(e.target.value));
$("#eventSel").addEventListener("change", e => { const id = e.target.value; if (!id) return;
  withBusy(null, async () => { const r = await api(`/api/events/${id}`, {method: "POST"}); activeRun = r.runs[0]?.id || null; view = "dm"; await load(); if (activeRun) showRun(activeRun); toast(r.note || "Email received and processed"); }); });
$("#resetBtn").addEventListener("click", () => withBusy(null, async () => { await api("/api/reset", {method: "POST"}); chats.clear(); activeRun = null; view = "dm"; await load(); toast("Demo reset"); }));
load().catch(e => toast("⚠ " + e.message));
</script>
</body>
