<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filare Brain</title>
<style>
  :root {
    --side: #3f0e40; --side-2: #350d36; --side-text: #d8c8d9; --side-active: #1164a3;
    --bg: #ffffff; --bg-2: #f8f8f8; --line: #e3e3e3; --text: #1d1c1d; --muted: #616061;
    --ok: #007a5a; --ok-bg: #e8f5ef; --warn: #b46900; --warn-bg: #fff4e0; --danger: #c0262d; --danger-bg: #fdecec;
    --blue: #1264a3; --blue-bg: #e8f1fa; --chip: #f1f1f1;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text); background: var(--bg); }
  #app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
  aside { background: var(--side); color: var(--side-text); overflow-y: auto; padding-bottom: 20px; }
  .ws { padding: 14px 16px; border-bottom: 1px solid #5a2a5b; }
  .ws b { color: #fff; font-size: 17px; display: block; }
  .ws small { font-size: 12px; }
  .me { padding: 12px 16px; border-bottom: 1px solid #5a2a5b; }
  .me label { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .me select { width: 100%; margin-top: 4px; padding: 6px; border-radius: 6px; border: 0; font-size: 14px; }
  .me .role { font-size: 12px; margin-top: 4px; }
  .group { padding: 12px 8px 0; }
  .group h4 { margin: 0 8px 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: #b9a6ba; }
  .nav { display: flex; justify-content: space-between; align-items: center; padding: 4px 10px; border-radius: 6px; cursor: pointer; color: var(--side-text); }
  .nav:hover { background: var(--side-2); }
  .nav.active { background: var(--side-active); color: #fff; }
  .badge { background: #e01e5a; color: #fff; border-radius: 9px; font-size: 12px; padding: 0 7px; font-weight: 700; }
  main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 18px; border-bottom: 1px solid var(--line); }
  header h2 { margin: 0; font-size: 18px; }
  header .sub { color: var(--muted); font-size: 13px; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 10px; font-weight: 600; white-space: nowrap; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.danger { background: var(--danger-bg); color: var(--danger); } .pill.grey { background: var(--chip); color: var(--muted); }
  .pill.blue { background: var(--blue-bg); color: var(--blue); }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 5px 10px; }
  button:hover { background: var(--bg-2); }
  button.primary { background: var(--ok); color: #fff; border-color: var(--ok); }
  button.primary:hover { background: #00634a; }
  button.danger { color: var(--danger); border-color: #efb6b8; }
  button:disabled { opacity: .5; cursor: default; }
  #content { flex: 1; overflow-y: auto; padding: 16px 18px 24px; }
  .intro { background: var(--blue-bg); color: #0b3d66; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; }
  .msg { display: flex; gap: 10px; margin-bottom: 16px; }
  .avatar { width: 36px; height: 36px; border-radius: 6px; flex: none; display: grid; place-items: center; font-weight: 700; color: #fff; background: #4a154b; }
  .avatar.user { background: #2eb67d; }
  .msg .who { font-weight: 700; } .msg .when { color: var(--muted); font-size: 12px; margin-left: 6px; font-weight: 400; }
  .msg .body { flex: 1; min-width: 0; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 6px 0; background: #fff; }
  .card.warn { border-left: 4px solid var(--warn); } .card.danger { border-left: 4px solid var(--danger); background: #fffafa; }
  .card.ok { border-left: 4px solid var(--ok); } .card.brief { border-left: 4px solid #4a154b; }
  .card h3 { margin: 0 0 4px; font-size: 16px; }
  .card h5 { margin: 12px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .card ul { margin: 0; padding-left: 18px; } .card li { margin: 3px 0; }
  .headline { font-weight: 600; margin: 6px 0; }
  .meta { color: var(--muted); font-size: 12px; }
  .chip { display: inline-block; font-size: 12px; background: var(--chip); border: 1px solid #ddd; border-radius: 10px; padding: 0 7px; margin: 0 2px; cursor: pointer; white-space: nowrap; color: #333; font-family: ui-monospace, Consolas, monospace; }
  .chip:hover { background: #e4e4e4; }
  details { margin-top: 6px; font-size: 13px; color: var(--muted); } details ol { margin: 4px 0; padding-left: 18px; }
  textarea, input[type=text] { width: 100%; font: inherit; padding: 7px 9px; border: 1px solid #c9c9c9; border-radius: 6px; }
  textarea { min-height: 96px; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .row input[type=text] { flex: 1; min-width: 160px; }
  .quote { background: var(--bg-2); border-left: 3px solid #ccc; padding: 6px 10px; margin: 6px 0; font-size: 14px; white-space: pre-wrap; }
  .compose { border-top: 1px solid var(--line); padding: 10px 18px 14px; }
  .compose form { display: flex; gap: 8px; } .compose input { flex: 1; }
  .suggest { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .suggest button { font-size: 12px; border-radius: 12px; padding: 2px 9px; color: var(--blue); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; border-bottom: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
  th { background: var(--bg-2); position: sticky; top: -16px; }
  #drawer { position: fixed; top: 0; right: 0; width: min(440px, 100vw); height: 100vh; background: #fff; box-shadow: -4px 0 20px rgba(0,0,0,.15); padding: 18px; overflow-y: auto; transform: translateX(105%); transition: transform .18s; z-index: 10; }
  #drawer.open { transform: none; }
  #drawer pre { white-space: pre-wrap; font: inherit; background: var(--bg-2); padding: 10px; border-radius: 6px; }
  .email { max-width: 680px; border: 1px solid var(--line); border-radius: 8px; }
  .email .hdr { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--bg-2); font-size: 14px; }
  .email .inner { padding: 16px; }
  .check { display: grid; grid-template-columns: 34px 1fr; gap: 10px; margin-bottom: 14px; }
  .check .n { width: 30px; height: 30px; border-radius: 50%; background: #4a154b; color: #fff; display: grid; place-items: center; font-weight: 700; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1d1c1d; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 20; }
  .empty { color: var(--muted); padding: 20px 0; }
  .warnbox { background: var(--danger-bg); border: 1px solid #efb6b8; color: #7a1519; border-radius: 6px; padding: 6px 10px; margin: 8px 0; font-size: 14px; }
  .warnbox ul { margin: 2px 0 0; padding-left: 18px; }
  label.f { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 3px; }
  @media (max-width: 760px) { #app { grid-template-columns: 1fr; } aside { max-height: 40vh; } }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="ws"><b>Filare Labs</b><small id="mode"></small></div>
    <div class="me">
      <label for="who">You are</label>
      <select id="who"></select>
      <div class="role" id="role"></div>
    </div>
    <div class="group"><h4>Brain</h4>
      <div class="nav" data-view="brain"><span>🧠 Brain <small>(DM)</small></span><span id="b-brain"></span></div>
      <div class="nav" data-view="email"><span>📧 Morning email</span></div>
    </div>
    <div class="group"><h4>Needs a person</h4>
      <div class="nav" data-view="approvals"><span>✋ Approvals</span><span id="b-approvals"></span></div>
      <div class="nav" data-view="memory"><span>🗂 Memory review</span><span id="b-memory"></span></div>
    </div>
    <div class="group"><h4>Channels</h4><div id="channels"></div></div>
    <div class="group"><h4>Work</h4>
      <div class="nav" data-view="inbox"><span>📥 Email</span></div>
      <div class="nav" data-view="tasks"><span>☑ Tasks</span></div>
    </div>
    <div class="group"><h4>Trust</h4>
      <div class="nav" data-view="log"><span>📜 Audit log</span></div>
      <div class="nav" data-view="outbox"><span>📤 Outbox (mock)</span></div>
      <div class="nav" data-view="checks"><span>🧪 Jury checklist</span></div>
    </div>
  </aside>
  <main>
    <header>
      <div><h2 id="title"></h2><div class="sub" id="subtitle"></div></div>
      <div class="tools">
        <span class="pill grey" id="clock"></span>
        <button id="sweep" title="The sweep also runs on its own at start-up and on a timer">☀ Run morning sweep</button>
        <span id="incoming"></span>
        <button id="paste" title="Type or paste your own email and see if you can trick the Brain">✉ Paste an email…</button>
        <button id="reset" title="Restore the demo data">↺ Reset demo</button>
      </div>
    </header>
    <div id="content"></div>
    <div class="compose" id="compose">
      <div class="suggest" id="suggest"></div>
      <form id="askform"><input type="text" id="q" placeholder="Ask the Brain… (it answers only from memory your team approved)" autocomplete="off"><button class="primary">Ask</button></form>
    </div>
  </main>
</div>
<div id="drawer"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
const URLP = new URLSearchParams(location.search);  // demo links: ?as=sara&view=approvals
let S = null, me = URLP.get("as") || store.get("brain.user") || "davide", view = URLP.get("view") || store.get("brain.view") || "brain", lastJSON = "", seen = {};
const drafts = {}, reasons = {}, speechTexts = {};
let thinking = null;
const SUGGEST = ["When does the Langhe fix roll out?", "What's our cash runway?", "What's the office Wi-Fi password?",
                 "How much is the Langhe contract worth?", "What is the Q1 2027 cloud budget?"];
const ICON = { email: "✉", chat: "#", doc: "📄", task: "☑", mem: "🧠", act: "✋" };

function hhmm(at) { return (at || "").slice(11, 16); }
function day(at) { const [y,m,d] = at.slice(0,10).split("-").map(Number); return new Date(y, m-1, d).toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"}); }
function pname(id) { const p = S && S.people.find(p => p.id === id); return p ? p.name : id; }
function chip(id) { const k = id.split("-")[0]; return `<span class="chip" data-src="${esc(id)}">${ICON[k] || "•"} ${esc(id)}</span>`; }
function chips(ids) { return (ids || []).map(chip).join(""); }
function warnBox(list, title) { return list && list.length ? `<div class="warnbox"><b>⚠ ${esc(title)}</b><ul>${list.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""; }
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 2600); }

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ user: me, ...body }) } : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { toast(j.error || `Error ${r.status}`); throw new Error(j.error); }
  return j;
}

async function refresh(force) {
  let j;
  try { j = await api(`/api/state?user=${encodeURIComponent(me)}`); } catch { return; }
  const txt = JSON.stringify(j);
  if (!force && txt === lastJSON) return;
  const busy = document.activeElement && document.activeElement.closest && document.activeElement.closest("#content") && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  S = j; lastJSON = txt;
  renderChrome();
  if (!busy || force) render();
}

function renderChrome() {
  const sel = $("#who");
  if (!sel.options.length) {
    sel.innerHTML = S.people.map(p => `<option value="${p.id}">${esc(p.name)} · ${esc(p.role)}</option>`).join("");
  }
  sel.value = me;
  $("#role").textContent = "Groups: " + S.me.groups.join(", ");
  const live = S.mode === "gemini";
  $("#mode").innerHTML = live ? (S.llm.paused ? "Brain: Gemini had errors, using plain rules for a moment" : `Brain: Gemini live (${esc(S.llm.model)})${S.llm.last_error ? " · last call failed, rules used" : ""}`)
                              : "Brain: offline rules (no Gemini key)";
  $("#clock").textContent = `Demo time: ${day(S.clock)} ${hhmm(S.clock)}`;
  $("#sweep").disabled = S.sweep === "running";
  $("#sweep").textContent = S.sweep === "running" ? "☀ Brain is writing briefs…" : "☀ Run morning sweep";
  $("#incoming").innerHTML = S.incoming.map(i => `<button data-sim="${i.id}" ${i.arrived ? "disabled" : ""} title="Make this new email arrive now">✉ ${esc(i.button)}</button>`).join(" ");
  $("#channels").innerHTML = Object.keys(S.channels).map(c => `<div class="nav" data-view="ch:${esc(c)}"><span>${esc(c)}</span></div>`).join("");
  const waitMe = S.actions.filter(a => a.can_decide).length, memMe = S.memory.filter(m => m.can_review).length;
  const unread = S.dms.length - (seen[me] || 0);
  $("#b-approvals").innerHTML = waitMe ? `<span class="badge">${waitMe}</span>` : "";
  $("#b-memory").innerHTML = memMe ? `<span class="badge">${memMe}</span>` : "";
  $("#b-brain").innerHTML = unread > 0 && view !== "brain" ? `<span class="badge">${unread}</span>` : "";
  document.querySelectorAll(".nav").forEach(n => n.classList.toggle("active", n.dataset.view === view));
}

const VIEWS = {
  brain: ["🧠 Brain", "Your colleague. It writes to you first, answers only from approved memory, and asks before it acts."],
  email: ["📧 Morning email", "The same brief, as the email you'd get at 08:30."],
  approvals: ["✋ Approvals", "Nothing is sent, paid or changed until the named person clicks Approve."],
  memory: ["🗂 Memory review", "People decide what the Brain is allowed to know."],
  inbox: ["📥 Email", "Emails your groups can see (the Brain reads them as data, never as instructions)."],
  tasks: ["☑ Tasks", "Tasks your groups can see."],
  log: ["📜 Audit log", "Every step: who asked, what the Brain read, proposed, and who approved."],
  outbox: ["📤 Outbox (mock)", "What approved actions would send. Nothing leaves this demo."],
  checks: ["🧪 Jury checklist", "The seven checks, one click each."],
};

function render() {
  if (view === "brain") seen[me] = S.dms.length;
  const [t, sub] = view.startsWith("ch:") ? [view.slice(3), "Channel (read-only in this demo)"] : (VIEWS[view] || VIEWS.brain);
  $("#title").textContent = t; $("#subtitle").textContent = sub;
  $("#compose").style.display = view === "brain" ? "" : "none";
  $("#suggest").innerHTML = SUGGEST.map(q => `<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join("");
  const el = $("#content");
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  const html = view === "brain" ? renderBrain() : view === "email" ? renderEmail() : view === "approvals" ? renderApprovals()
    : view === "memory" ? renderMemory() : view === "inbox" ? renderInbox() : view === "tasks" ? renderTasks()
    : view === "log" ? renderLog() : view === "outbox" ? renderOutbox() : view === "checks" ? renderChecks()
    : renderChannel(view.slice(3));
  el.innerHTML = html;
  for (const [id, v] of Object.entries(drafts)) { const ta = el.querySelector(`textarea[data-draft="${id}"]`); if (ta) ta.value = v; }
  for (const [id, v] of Object.entries(reasons)) { const i = el.querySelector(`input[data-reason="${id}"]`); if (i) i.value = v; }
  if (view === "brain" && atBottom) el.scrollTop = el.scrollHeight;
  renderChrome();
}

/* ---------- Brain DM ---------- */
function thinkingHtml() {
  if (!thinking) return "";
  const last = S.dms[S.dms.length - 1];
  const q = last && last.kind === "question" && last.text === thinking ? "" :
    `<div class="msg"><div class="avatar user">${esc(S.me.name[0])}</div><div class="body"><span class="who">${esc(S.me.name)}</span><div>${esc(thinking)}</div></div></div>`;
  return q + `<div class="msg"><div class="avatar">🧠</div><div class="body"><span class="who">Brain</span><div class="meta">Looking in the approved memory you may see…</div></div></div>`;
}
function renderBrain() { return renderBrainMsgs() + thinkingHtml(); }
function renderBrainMsgs() {
  if (!S.dms.length) return `<div class="empty">${S.sweep === "running" ? "The Brain is reading this morning's email, chat and tasks…" : "No messages yet. The morning sweep posts your brief here on its own."}</div>`;
  return S.dms.map(m => {
    if (m.kind === "question") return `<div class="msg"><div class="avatar user">${esc(S.me.name[0])}</div><div class="body"><span class="who">${esc(S.me.name)}</span><span class="when">${hhmm(m.at)}</span><div>${esc(m.text)}</div></div></div>`;
    return `<div class="msg"><div class="avatar">🧠</div><div class="body"><span class="who">Brain</span><span class="when">${day(m.at)} ${hhmm(m.at)}</span>${m.kind === "brief" ? briefCard(m) : m.kind === "alert" ? alertCard(m) : answerCard(m)}</div></div>`;
  }).join("");
}

function briefCard(m) {
  const tr = m.trace || {};
  speechTexts[m.id] = [m.title, m.headline.text, ...m.sections.map(s => s.title + ". " + s.bullets.map(b => b.text).join(". "))].join(". ");
  return `<div class="card brief"><h3>☀ ${esc(m.title)}</h3>
    <div class="meta">Posted on its own by the morning sweep. Nobody asked. Everything below is filtered to what you may see. <button data-speak="${esc(m.id)}" title="Read this brief aloud (your browser's voice)">🔊 Read aloud</button></div>
    <div class="headline">${esc(m.headline.text)} ${chips(m.headline.cites)}</div>
    ${m.sections.map(s => `<h5>${esc(s.title)}</h5><ul>${s.bullets.map(b => `<li>${b.level === "danger" ? "⚠ " : ""}${esc(b.text)} ${chips(b.cites)}</li>`).join("")}</ul>`).join("") || "<p>Nothing needs you today.</p>"}
    <details><summary>How this brief was made</summary><ol>
      <li>Items chosen by code from approved memory, your tasks, new alerts and approvals waiting for you.</li>
      <li>Opening line: ${tr.mode === "gemini" ? `Gemini ${esc(tr.model || "")}, ${tr.ms || 0} ms, $${tr.cost_usd || 0}; citations checked` : "rules (offline): the most important item"}${tr.guard ? `. Guard: ${esc(tr.guard)}` : ""}.</li>
    </ol></details></div>`;
}

function alertCard(m) {
  const lvl = m.level === "danger" ? "danger" : m.level === "ok" ? "ok" : "warn";
  const icon = lvl === "danger" ? "⚠ Suspicious" : lvl === "ok" ? "✅ Update" : "🔔 New";
  return `<div class="card ${lvl}"><b>${icon}</b> <span class="meta">posted on its own, nobody asked</span><div>${esc(m.headline)} ${chips(m.cites)}</div>
    ${m.trace ? `<div class="meta">Read by: ${m.trace.mode === "gemini" ? "Gemini " + esc(m.trace.model || "") : "offline rules"}</div>` : ""}</div>`;
}

function answerCard(m) {
  const pill = { answered: ["ok", "Answered from approved memory"], unknown: ["grey", "I don't know"],
                 restricted: ["warn", "Not for your role"], pending: ["warn", "Waiting for a person's approval"] }[m.status];
  return `<div class="card"><span class="pill ${pill[0]}">${pill[1]}</span>
    <div style="margin-top:6px">${esc(m.text)}</div>
    ${m.cites.length ? `<div class="meta" style="margin-top:6px">${m.status === "answered" ? "Memory used" : "Unapproved note"}: ${chips(m.cites)}${m.sources.length ? ` · original sources: ${chips(m.sources)}` : ""}</div>` : ""}
    <details><summary>How I got this</summary><ol>${m.trace.map(t => `<li>${esc(t)}</li>`).join("")}</ol></details></div>`;
}

/* ---------- Morning email ---------- */
function renderEmail() {
  const b = [...S.dms].reverse().find(m => m.kind === "brief");
  if (!b) return `<div class="empty">No brief yet today.</div>`;
  return `<div class="email"><div class="hdr"><div><b>From:</b> Filare Brain &lt;brain@filare.example&gt;</div><div><b>To:</b> ${esc(S.me.name)}</div>
    <div><b>Subject:</b> ${esc(b.title)}</div><div class="meta">${day(b.at)} ${hhmm(b.at)} · sent automatically</div></div>
    <div class="inner"><p>Hi ${esc(S.me.name.split(" ")[0])},</p><p><b>${esc(b.headline.text)}</b></p>
    ${b.sections.map(s => `<p style="margin-bottom:2px"><b>${esc(s.title)}</b></p><ul>${s.bullets.map(x => `<li>${esc(x.text)} ${chips(x.cites)}</li>`).join("")}</ul>`).join("")}
    <p>Things waiting for your OK are in <a href="#" data-goto="approvals">Approvals</a> and <a href="#" data-goto="memory">Memory review</a>. I won't act on anything until you decide.</p>
    <p class="meta">Every line links to its source. Reply "wrong" to any line and a person will check it.</p></div></div>`;
}

/* ---------- Approvals ---------- */
function renderApprovals() {
  const acts = [...S.actions].sort((a, b) => (a.status === "waiting" ? 0 : 1) - (b.status === "waiting" ? 0 : 1) || (b.can_decide - a.can_decide));
  const intro = `<div class="intro">The Brain has <b>no tool to send, pay or change anything</b>. It can only propose. Each proposal names the one person who decides. You can edit a draft before approving it. Everything is logged.</div>`;
  if (!acts.length) return intro + `<div class="empty">No proposals you can see.</div>`;
  return intro + acts.map(a => {
    const head = `<h3>${a.kind === "email" ? "✉" : "☑"} ${esc(a.title)}</h3>
      <div class="meta">${chip(a.id)} proposed by the Brain (${esc(a.origin)}) at ${hhmm(a.created_at)} · decides: <b>${esc(a.approver_name)}</b></div>
      <div style="margin-top:6px"><b>Why:</b> ${esc(a.why)} ${chips(a.sources)}</div>${warnBox(a.warnings, "The Brain's self-check: read the draft carefully before you approve")}`;
    let body = "";
    if (a.kind === "email") {
      body = `<div class="meta" style="margin-top:8px">To: <b>${esc(a.to_name)}</b> · Subject: ${esc(a.subject)}</div>` +
        (a.can_decide ? `<textarea data-draft="${a.id}">${esc(a.body)}</textarea>` : `<div class="quote">${esc(a.body)}</div>`);
    } else if (a.task_id) {
      body = `<div class="meta" style="margin-top:8px">On approval: ${chip(a.task_id)} is unblocked for ${esc(pname(a.owner))}.</div>`;
    }
    let foot;
    if (a.status === "waiting" && a.can_decide) {
      foot = `<div class="row"><button class="primary" data-act="${a.id}" data-d="approve">✓ Approve${a.kind === "email" ? " & send" : ""}</button>
        <input type="text" data-reason="${a.id}" placeholder="Reason (optional, saved in the log)"><button class="danger" data-act="${a.id}" data-d="reject">✗ Reject</button></div>`;
    } else if (a.status === "waiting") {
      foot = `<div class="row"><span class="pill warn">⏳ Waiting for ${esc(a.approver_name)}</span><span class="meta">Only ${esc(a.approver_name)} can approve this. Switch to them on the left to try.</span></div>`;
    } else if (a.status === "approved") {
      foot = `<div class="row"><span class="pill ok">✓ Approved by ${esc(pname(a.decided_by))} at ${hhmm(a.decided_at)}</span>${a.edited_by ? `<span class="pill blue">draft edited by ${esc(pname(a.edited_by))}</span>` : ""}</div>`;
    } else {
      foot = `<div class="row"><span class="pill danger">✗ Rejected by ${esc(pname(a.decided_by))} at ${hhmm(a.decided_at)}</span>${a.reason ? `<span class="meta">“${esc(a.reason)}”</span>` : ""}</div>`;
    }
    return `<div class="card ${a.status === "waiting" ? "warn" : a.status === "approved" ? "ok" : "danger"}">${head}${body}${foot}</div>`;
  }).join("");
}

/* ---------- Memory ---------- */
function renderMemory() {
  const pend = S.memory.filter(m => m.status === "pending").sort((a, b) => b.warnings.length - a.warnings.length), ok = S.memory.filter(m => m.status === "approved"), no = S.memory.filter(m => m.status === "rejected");
  const intro = `<div class="intro">The Brain answers <b>only from approved memory</b>. New notes it extracts wait here. Compare each with its source before you decide: the model can misread.</div>`;
  const pendHtml = pend.length ? pend.map(m => `<div class="card ${m.warnings.length ? "danger" : "warn"}"><div class="meta">${chip(m.id)} proposed by ${esc(m.proposed_by || "the Brain")} · visible to: ${esc(m.acl.join(", "))}</div>
      <div class="headline">“${esc(m.fact)}”</div>${warnBox(m.warnings, "Check against the source before you approve")}
      ${m.source_items.map(s => `<div class="quote"><b>${esc(s.id)} · ${esc(s.title)}</b>\n${esc(s.text)}</div>`).join("")}
      ${m.can_review ? `<div class="row"><button class="primary" data-mem="${m.id}" data-d="approve">✓ Approve</button>
        <input type="text" data-reason="${m.id}" placeholder="Why reject? (e.g. the source says 38k)"><button class="danger" data-mem="${m.id}" data-d="reject">✗ Reject</button></div>`
        : `<div class="meta">You can't review this one: you can't see all its sources.</div>`}</div>`).join("")
    : `<div class="empty">Nothing to review.</div>`;
  const row = m => `<tr><td>${chip(m.id)}</td><td>${esc(m.fact)}${m.reason ? `<div class="meta">Reason: ${esc(m.reason)}</div>` : ""}</td><td>${chips(m.sources)}</td><td>${esc(m.acl.join(", "))}</td><td>${esc(pname(m.reviewed_by || m.approved_by || ""))}${m.reviewed_at ? " · " + hhmm(m.reviewed_at) : ""}</td></tr>`;
  const tbl = rows => `<table><tr><th>Id</th><th>Fact</th><th>Sources</th><th>Who can see</th><th>Decided by</th></tr>${rows.map(row).join("")}</table>`;
  return intro + `<h4>Waiting for a person (${pend.length})</h4>` + pendHtml +
    `<h4>Approved: the Brain may use these (${ok.length} you can see)</h4>` + tbl(ok) +
    (no.length ? `<h4>Rejected: never used (${no.length})</h4>` + tbl(no) : "");
}

/* ---------- read-only views ---------- */
function renderChannel(c) {
  const msgs = S.channels[c] || [];
  return msgs.map(m => `<div class="msg"><div class="avatar user">${esc(m.author[0])}</div><div class="body"><span class="who">${esc(m.author)}</span><span class="when">${day(m.date)} ${hhmm(m.date)}</span> ${chip(m.id)}<div>${esc(m.text)}</div></div></div>`).join("") || `<div class="empty">No messages you can see.</div>`;
}
function renderInbox() {
  return S.inbox.map(e => `<div class="card ${e.flag ? "danger" : ""}">${e.flag ? `<div class="pill danger">⚠ Flagged by the Brain: ${esc(e.flag)}. Treated as data. Nothing it asks will happen.</div>` : ""}
    <div class="meta">${chip(e.id)} ${day(e.date)} ${hhmm(e.date)} · from <b>${esc(e.from_name)}</b> · to ${esc(e.to.map(pname).join(", "))}${e.to_me ? ' <span class="pill blue">to you</span>' : ""}</div>
    <b>${esc(e.title)}</b><div>${esc(e.text)}</div></div>`).join("") || `<div class="empty">No email you can see.</div>`;
}
function renderTasks() {
  return `<table><tr><th>Id</th><th>Task</th><th>Owner</th><th>Due</th><th>Status</th></tr>${S.tasks.map(t => `<tr><td>${chip(t.id)}</td><td>${esc(t.title)}</td><td>${esc(pname(t.owner))}</td><td>${esc(t.due)}</td><td>${esc(t.status)}${t.blocked_by ? ` (waiting for ${esc(t.blocked_by)})` : ""}${t.approved_by ? ` · approved by ${esc(pname(t.approved_by))}` : ""}</td></tr>`).join("")}</table>`;
}
function renderLog() {
  const u = S.llm;
  return `<div class="intro">You see the entries about things your role may see. Model usage so far: ${u.calls} Gemini calls, ${u.input_tokens + u.output_tokens} tokens, $${u.cost_usd}.</div>
    <table><tr><th>Time</th><th>Who</th><th>What</th><th>Detail</th><th>Refs</th></tr>${[...S.log].reverse().map(e => `<tr><td>${hhmm(e.at)}</td><td>${esc(pname(e.actor))}</td><td>${esc(e.event)}</td><td>${esc(e.detail)}</td><td>${chips(e.refs)}</td></tr>`).join("")}</table>`;
}
function renderOutbox() {
  return `<div class="intro">Approved emails land here. It's a mock: nothing leaves this demo. A real deployment would hand them to Gmail or Outlook only after the same approval.</div>` +
    (S.outbox.map(o => `<div class="card ok"><div class="meta">${chip(o.id)} from ${chip(o.action)} · approved by <b>${esc(pname(o.approved_by))}</b> at ${hhmm(o.sent_at)}</div><b>To ${esc(pname(o.to))}: ${esc(o.subject)}</b><div class="quote">${esc(o.body)}</div></div>`).join("") || `<div class="empty">Empty. Nothing has been approved yet.</div>`);
}
function renderChecks() {
  const C = [
    ["It speaks first", "Open as <b>Davide</b> → 🧠 Brain: the morning brief was posted on its own at start-up. Then press <b>✉ Customer: frost warning</b>: Paolo and Davide get an alert without asking.", "davide"],
    ["People curate the memory", "As <b>Davide</b>: ask “When does the Langhe fix roll out?” → I don't know (note not approved). In 🗂 Memory review approve <b>mem-p01</b> and reject <b>mem-p02</b> (source says 38k, not 83k). Ask again → answered, citing mem-p01.", "davide"],
    ["It knows who's asking", "Ask “What's our cash runway?” as <b>Giulia</b> (finance) → answer. Same as <b>Sara</b> (tech) → “I can't share that with you”. The filter runs in code before the model sees anything; typing “I'm the CFO” changes nothing.", "giulia"],
    ["It cites", "Every answer and brief line has chips (🧠 memory, ✉ email, # chat, ☑ task). Click one to open the original.", "davide"],
    ["It admits gaps", "Ask “What's the office Wi-Fi password?” → “I don't know”.", "sara"],
    ["It only proposes", "As <b>Sara</b>: ✋ Approvals shows the certificate renewal waiting for Marco; she can't approve it. Switch to <b>Marco</b> and approve → task-004 unblocked, Sara gets told, the log records it. As <b>Luca</b>: edit the SensorParts draft, approve → 📤 Outbox.", "sara"],
    ["It fits the team's day", "This Slack-style workspace: brief as a DM, alerts, approvals with a button, plus 📧 Morning email.", "luca"],
  ];
  return `<div class="intro">Try to break it too: press <b>✉ Fake CEO payment request</b> (Luca sees a fraud warning, nothing is proposed), or look at <b>email-008</b> in Sara's brief (a prompt injection, ignored).</div>` +
    C.map((c, i) => `<div class="check"><div class="n">${i + 1}</div><div><b>${c[0]}</b><div>${c[1]}</div><div class="row"><button data-switch="${c[2]}">Be ${esc(pname(c[2]))} →</button></div></div></div>`).join("");
}

/* ---------- drawer ---------- */
async function openSource(id) {
  const d = $("#drawer");
  try {
    const s = await api(`/api/source?user=${encodeURIComponent(me)}&id=${encodeURIComponent(id)}`);
    d.innerHTML = `<button id="close" style="float:right">✕</button><div class="meta">${esc(s.kind)} · ${esc(s.id)}${s.date ? " · " + esc(s.date) : ""}</div>
      <h3>${esc(s.title)}</h3>${s.from ? `<div class="meta">From: ${esc(pname(s.from))}</div>` : ""}${s.status ? `<span class="pill grey">${esc(s.status)}</span>` : ""}
      ${s.flag ? `<div class="pill danger">⚠ Flagged: ${esc(s.flag)}</div>` : ""}
      <pre>${esc(s.text)}</pre>${s.sources ? `<div class="meta">Sources: ${chips(s.sources)}</div>` : ""}${s.acl ? `<div class="meta">Visible to: ${esc(s.acl.join(", "))}</div>` : ""}`;
  } catch (e) {
    d.innerHTML = `<button id="close" style="float:right">✕</button><h3>${esc(id)}</h3><p>You can't open this: it isn't visible to your role.</p>`;
  }
  d.classList.add("open");
}

function openPaste() {
  const d = $("#drawer");
  d.innerHTML = `<button id="close" style="float:right">✕</button><h3>✉ Paste an email</h3>
    <p class="meta">Pretend this email just arrived for <b>${esc(S.me.name)}</b>. Only their team can see it. The Brain reads it as <b>data</b>: try a fraud request or an instruction hidden in the text, and see if it does anything.</p>
    <label class="f" for="pf">From</label><input type="text" id="pf" value="supplier@example.com" maxlength="200">
    <label class="f" for="ps">Subject</label><input type="text" id="ps" maxlength="200" placeholder="Subject">
    <label class="f" for="pb">Message</label><textarea id="pb" maxlength="2000" placeholder="Write or paste the email…"></textarea>
    <div class="row"><button class="primary" id="pastego">Deliver it</button></div>`;
  d.classList.add("open");
}
async function sendPaste() {
  try {
    const r = await api("/api/inbound", { from: $("#pf").value, subject: $("#ps").value, body: $("#pb").value });
    $("#drawer").classList.remove("open"); view = "brain"; toast(r.level === "danger" ? "Flagged as suspicious: nothing was done" : "Delivered: the Brain is reading it");
  } catch {}
  refresh(true);
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-view],[data-src],[data-sim],[data-act],[data-mem],[data-q],[data-switch],[data-goto],[data-speak],#close,#sweep,#reset,#paste,#pastego");
  if (!t) return;
  if (t.id === "close") return $("#drawer").classList.remove("open");
  if (t.dataset.speak) {
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(speechTexts[t.dataset.speak] || ""); u.lang = "en-GB"; speechSynthesis.speak(u); }
    catch { toast("This browser can't read aloud"); }
    return;
  }
  if (t.id === "paste") return openPaste();
  if (t.id === "pastego") return sendPaste();
  if (t.dataset.view) { view = t.dataset.view; store.set("brain.view", view); return render(); }
  if (t.dataset.goto) { e.preventDefault(); view = t.dataset.goto; return render(); }
  if (t.dataset.src) return openSource(t.dataset.src);
  if (t.dataset.switch) { me = t.dataset.switch; store.set("brain.user", me); view = "brain"; lastJSON = ""; return refresh(true); }
  if (t.dataset.q) { $("#q").value = t.dataset.q; $("#q").focus(); return; }
  if (t.id === "sweep") { await api("/api/sweep", {}); toast("Morning sweep running…"); return setTimeout(() => refresh(true), 500); }
  if (t.id === "reset") { if (!confirm("Reset the demo to its starting data?")) return; await api("/api/reset", {}); Object.keys(drafts).forEach(k => delete drafts[k]); seen = {}; toast("Demo reset"); return refresh(true); }
  if (t.dataset.sim) { t.disabled = true; toast("New email arriving… the Brain is reading it"); try { await api("/api/simulate", { id: t.dataset.sim }); } catch {} return refresh(true); }
  if (t.dataset.act) {
    const id = t.dataset.act, ta = document.querySelector(`textarea[data-draft="${id}"]`);
    await api("/api/action", { id, decision: t.dataset.d, body: ta ? ta.value : null, reason: reasons[id] || "" });
    delete drafts[id]; delete reasons[id]; toast(t.dataset.d === "approve" ? "Approved and logged" : "Rejected and logged"); return refresh(true);
  }
  if (t.dataset.mem) {
    const id = t.dataset.mem;
    await api("/api/memory", { id, decision: t.dataset.d, reason: reasons[id] || "" });
    delete reasons[id]; toast(t.dataset.d === "approve" ? "Approved: the Brain can now use it" : "Rejected: it will never be used"); return refresh(true);
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset.draft) drafts[e.target.dataset.draft] = e.target.value;
  if (e.target.dataset.reason) reasons[e.target.dataset.reason] = e.target.value;
});
$("#who").addEventListener("change", e => { me = e.target.value; store.set("brain.user", me); lastJSON = ""; $("#drawer").classList.remove("open"); refresh(true); });
$("#askform").addEventListener("submit", async e => {
  e.preventDefault();
  const q = $("#q").value.trim(); if (!q) return;
  $("#q").value = ""; $("#q").disabled = true;
  thinking = q; render();  // show the question and a "looking…" line at once; the answer takes about 3 s
  try { await api("/api/ask", { question: q }); } finally { thinking = null; $("#q").disabled = false; $("#q").focus(); }
  refresh(true);
});
refresh(true);
setInterval(refresh, 2500);
</script>
</body>
</html>
