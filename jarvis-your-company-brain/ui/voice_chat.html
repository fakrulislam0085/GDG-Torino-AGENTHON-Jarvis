<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --panel:#FFFFFF; --text:#12161F; --text-2:#4A5563; --text-3:#5F6B78;
  --cyan:#0E7C86; --cyan-text:#0B6E77; --line:#DCE3E7; --line-2:#B9C8CE; --red:#B42318; --red-tint:#FBEEEC; --red-line:#E8B4AE;
  --tint:rgba(14,124,134,.06); --tint-2:rgba(14,124,134,.11);
  --sans:'IBM Plex Sans', system-ui, sans-serif; --mono:'IBM Plex Mono', ui-monospace, monospace; }
html, body { margin:0; background:transparent; font-family:var(--sans); color:var(--text); }
.vc { box-sizing:border-box; height:456px; padding:14px 12px 10px; display:flex; flex-direction:column; align-items:center; gap:12px; overflow:hidden; }
/* the orb: a teal blob that breathes while listening and swells while Jarvis speaks */
.stage { flex:none; width:180px; height:180px; display:flex; align-items:center; justify-content:center; }
.dot { width:132px; height:132px; border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #BFE6E8 0%, #4FB3BB 32%, var(--cyan) 72%, #0A5E66 100%);
  box-shadow:0 18px 44px rgba(14,124,134,.28), 0 0 0 0 rgba(14,124,134,.30); transition:transform .3s ease, filter .3s ease, opacity .3s ease; }
.vc[data-state="idle"] .dot { animation:breathe 4s ease-in-out infinite; }
.vc[data-state="ended"] .dot, .vc[data-state="error"] .dot { filter:saturate(.25); opacity:.6; animation:none; }
.vc[data-state="connecting"] .dot { animation:fade 1.2s ease-in-out infinite; }
.vc[data-state="listening"] .dot { animation:breathe 2.6s ease-in-out infinite, ring 2.6s ease-out infinite; }
.vc[data-state="speaking"] .dot { animation:pulse .6s ease-in-out infinite alternate, ring 1s ease-out infinite; }
.vc.muted .dot { filter:saturate(.4); }
@keyframes breathe { 0%,100% { transform:scale(.96); } 50% { transform:scale(1.04); } }
@keyframes fade { 50% { opacity:.5; transform:scale(.97); } }
@keyframes pulse { from { transform:scale(1.02); } to { transform:scale(1.22); } }
@keyframes ring { 0% { box-shadow:0 18px 44px rgba(14,124,134,.28), 0 0 0 0 rgba(14,124,134,.34); }
  100% { box-shadow:0 18px 44px rgba(14,124,134,.28), 0 0 0 30px rgba(14,124,134,0); } }
@media (prefers-reduced-motion: reduce) { .dot { animation:none !important; } }
.state { font-family:var(--mono); font-size:.8rem; letter-spacing:.1em; text-transform:uppercase; color:var(--cyan-text); }
.vc[data-state="error"] .state { color:var(--red); }
.tx { flex:none; width:100%; max-width:460px; height:7.4em; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; gap:.3em;
  text-align:center; font-size:.92rem; line-height:1.45; color:var(--text-3);
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 1.6em); mask-image:linear-gradient(to bottom, transparent 0, #000 1.6em); }
.tx .l { overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.tx .l.old { opacity:.5; font-size:.86rem; }
.tx .l b { font-weight:600; color:var(--cyan-text); }
.tx .l.you b { color:var(--text-2); }
.ctrls { flex:none; display:flex; gap:22px; align-items:center; justify-content:center; margin-top:auto; position:relative; z-index:1; background:#fff; padding-top:4px; }
.rb { width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;
  border:1px solid var(--line-2); background:var(--panel); color:var(--text); box-shadow:0 4px 14px rgba(18,22,31,.08);
  transition:background .15s ease, border-color .15s ease, transform .15s ease; padding:0; }
.rb:hover:not(:disabled) { border-color:var(--cyan); background:var(--tint); }
.rb:active:not(:disabled) { transform:scale(.96); }
.rb svg { width:26px; height:26px; }
.rb.go { background:var(--cyan); border-color:var(--cyan); color:#fff; }
.rb.go:hover:not(:disabled) { background:#0B6E77; border-color:#0B6E77; }
.rb.muted { background:var(--tint-2); color:var(--cyan-text); border-color:var(--cyan); }
.rb.end { background:var(--red-tint); border-color:var(--red-line); color:var(--red); }
.rb.end:hover:not(:disabled) { background:#F6DEDA; border-color:var(--red); }
.rb:disabled { opacity:.45; cursor:default; }
.rb:focus-visible { outline:2px solid var(--cyan); outline-offset:3px; }
.lab { font-size:.75rem; color:var(--text-3); text-align:center; margin-top:6px; font-family:var(--sans); }
.cw { display:flex; flex-direction:column; align-items:center; }
</style></head>
<body>
<div class="vc" id="vc" data-state="idle">
  <div class="stage"><div class="dot" aria-hidden="true"></div></div>
  <div class="state" id="state" role="status" aria-live="polite">Ready</div>
  <div class="tx" id="tx"><div class="l">Press the mic and ask about your brief, e.g. “What's most urgent?” Your browser will ask for the microphone.</div></div>
  <div class="ctrls">
    <div class="cw"><button class="rb go" id="start" title="Start talking" aria-label="Start talking">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
    </button><div class="lab" id="startlab">Start</div></div>
    <div class="cw"><button class="rb end" id="end" disabled title="End" aria-label="End the voice chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button><div class="lab">End</div></div>
  </div>
</div>
<script type="module">
const CFG = __CFG__;
const vc = document.getElementById('vc'), st = document.getElementById('state'), tx = document.getElementById('tx');
const bStart = document.getElementById('start'), bEnd = document.getElementById('end'), lab = document.getElementById('startlab');
const LABEL = { idle:'Ready', connecting:'Connecting…', listening:'Listening…', speaking:'Jarvis is speaking', ended:'Ended', error:'Voice unavailable' };
let conv = null, used = false, live = false, muted = false, lines = [];
function setState(s, msg) { vc.dataset.state = s; st.textContent = msg || LABEL[s] || s; }
function esc(t) { return String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function addLine(who, text) {
  if (!text) return;
  lines.push({ who, text }); lines = lines.slice(-2);
  tx.innerHTML = lines.map((l, i) => `<div class="l ${l.who === 'You' ? 'you' : ''} ${i < lines.length - 1 ? 'old' : ''}"><b>${l.who}:</b> ${esc(l.text)}</div>`).join('');
}
function hint(t) { tx.innerHTML = `<div class="l">${esc(t)}</div>`; }
function micIcon(off) {
  bStart.innerHTML = off
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M9 9v2a3 3 0 0 0 5.1 2.1M15 10V6a3 3 0 0 0-5.7-1.3"/><path d="M5 11a7 7 0 0 0 11.5 5.3M19 11a7 7 0 0 1-.6 2.8"/><path d="M12 18v3"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>';
}
function ended(note) {
  conv = null; live = false; bEnd.disabled = true; bStart.disabled = true; vc.classList.remove('muted');
  bStart.className = 'rb'; micIcon(false); lab.textContent = 'Start';
  setState('ended');
  hint(note || 'Chat ended. Press “New voice chat” below to talk again.');
}
let Conversation = null;
async function loadSdk() {
  if (Conversation) return Conversation;
  try { ({ Conversation } = await import('https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.35.0/+esm')); }
  catch (e) { ({ Conversation } = await import('https://cdn.jsdelivr.net/npm/@11labs/client@0.2.0/+esm')); }
  return Conversation;
}
function toggleMute() {
  if (!conv || typeof conv.setMicMuted !== 'function') return;
  muted = !muted;
  try { conv.setMicMuted(muted); } catch (e) { muted = !muted; return; }
  vc.classList.toggle('muted', muted);
  bStart.className = 'rb' + (muted ? ' muted' : ''); micIcon(muted);
  bStart.title = muted ? 'Unmute' : 'Mute'; lab.textContent = muted ? 'Unmute' : 'Mute';
  if (muted) st.textContent = 'Muted';
}
bStart.addEventListener('click', async () => {
  if (live) { toggleMute(); return; }
  if (used || !CFG.signedUrl) return;
  used = true; bStart.disabled = true; setState('connecting'); hint('Connecting to Jarvis… allow the microphone if asked.');
  try {
    const C = await loadSdk();
    conv = await C.startSession({
      signedUrl: CFG.signedUrl,
      dynamicVariables: CFG.dynamicVariables,
      onConnect: () => {
        live = true; bEnd.disabled = false; bStart.disabled = false; bStart.className = 'rb'; bStart.title = 'Mute'; lab.textContent = 'Mute';
        setState('listening'); hint('Connected. Jarvis will greet you.');
      },
      onDisconnect: () => { if (vc.dataset.state !== 'error') ended(); },
      onError: (m) => { console.warn('voice error', m); },
      onModeChange: ({ mode }) => {
        if (['ended', 'error'].includes(vc.dataset.state)) return;
        setState(mode === 'speaking' ? 'speaking' : 'listening');
        if (muted && mode !== 'speaking') st.textContent = 'Muted';
      },
      onMessage: (p) => { const r = p.source || p.role; addLine(r === 'user' ? 'You' : 'Jarvis', p.message); },
    });
  } catch (e) {
    console.warn('voice start failed', e && e.message);
    conv = null; live = false; bEnd.disabled = true;
    const mic = e && /permission|denied|notallowed/i.test(String(e.name || '') + String(e.message || ''));
    setState('error', mic ? 'Microphone blocked' : 'Voice unavailable');
    hint(mic ? 'Allow the microphone for this page (icon in the address bar), then press “New voice chat”. Or use Play my brief.'
             : "Voice isn't available right now. Use Play my brief.");
  }
});
bEnd.addEventListener('click', async () => {
  bEnd.disabled = true;
  try { if (conv) await conv.endSession(); } catch (e) {}
  ended();
});
window.addEventListener('pagehide', () => { try { conv && conv.endSession(); } catch (e) {} });
</script>
</body></html>
